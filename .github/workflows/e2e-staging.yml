name: Admin + Vault + Proxmox/PBS/VMmanager/OS-Network E2E (disposable staging)
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'HTTPS URL of an installed DISPOSABLE staging Nuxt + PHP application'
        type: string
        required: true
      candidate_id:
        description: 'Trusted SHA-256 of the sealed release manifest'
        type: string
        required: true
      connector_fixture_host:
        description: 'DNS/IP of the supplied isolated TLS PVE/PBS/VMmanager/RouterOS fixture (PBS, VMmanager and RouterOS CA trusted by staging PHP), reachable from staging PHP'
        type: string
        required: true
      connector_fixture_port:
        description: 'Fixture HTTPS port'
        type: string
        default: '8443'
      connector_fixture_pin:
        description: 'SHA-256 DER fingerprint of the supplied fixture certificate (64 lowercase hex characters)'
        type: string
        required: true
      confirm_disposable_environment:
        description: 'I confirm this endpoint is a disposable staging database, NOT production'
        type: boolean
        required: true
permissions:
  contents: read
jobs:
  browser:
    if: ${{ inputs.confirm_disposable_environment == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: inventory-e2e-staging
    env:
      CI: 'true'
      E2E_BASE_URL: ${{ inputs.base_url }}
      CAJEER_CANDIDATE_ID: ${{ inputs.candidate_id }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_ADMIN_TOTP_SECRET: ${{ secrets.E2E_ADMIN_TOTP_SECRET }}
      E2E_CONNECTOR_UI: '1'
      E2E_CONNECTOR_FIXTURE_HOST: ${{ inputs.connector_fixture_host }}
      E2E_CONNECTOR_FIXTURE_PIN: ${{ inputs.connector_fixture_pin }}
      E2E_CONNECTOR_FIXTURE_PORT: ${{ inputs.connector_fixture_port }}
      E2E_VAULT_BINDINGS: '1'
      E2E_ISOLATED_STAGING: '1'
      E2E_ALLOW_WRITES: '1'
      E2E_TRANSFER_WRITABLE: '1'
      E2E_HISTORY_WRITABLE: '1'
      E2E_VAULT_UI: '1'
      E2E_EXPECT_WORKER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Verify reviewed npm locks
        run: node scripts/verify-dependency-locks.mjs
      - name: Audit browser dependencies
        working-directory: admin
        run: npm audit --package-lock-only --audit-level=high
      - name: Reproducible dependency installation
        working-directory: admin
        run: npm ci --include=dev --include=optional --no-audit --no-fund
      - name: Browser safety preflight
        working-directory: admin
        run: npm run test:e2e:preflight
      - name: Install Chromium
        working-directory: admin
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Execute real browser E2E against staging
        working-directory: admin
        run: bash ../scripts/verify-browser-e2e.sh
