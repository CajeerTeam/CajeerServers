name: Admin + Vault + Proxmox/PBS/VMmanager E2E (disposable staging)
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'HTTPS URL of an installed DISPOSABLE staging Nuxt + PHP application'
        type: string
        required: true
      connector_fixture_host:
        description: 'DNS/IP of the supplied isolated TLS PVE/PBS/VMmanager fixture (PBS and VMmanager CA trusted by staging PHP), reachable from staging PHP'
        type: string
        required: true
      connector_fixture_port:
        description: 'Fixture HTTPS port'
        type: string
        default: '8443'
      connector_fixture_pin:
        description: 'SHA-256 DER fingerprint of the supplied fixture certificate (64 lowercase hex characters)'
        type: string
        required: true
      confirm_disposable_environment:
        description: 'I confirm this endpoint is a disposable staging database, NOT production'
        type: boolean
        required: true
permissions:
  contents: read
jobs:
  browser:
    if: ${{ inputs.confirm_disposable_environment == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: inventory-e2e-staging
    env:
      CI: 'true'
      E2E_BASE_URL: ${{ inputs.base_url }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_ADMIN_TOTP_SECRET: ${{ secrets.E2E_ADMIN_TOTP_SECRET }}
      E2E_CONNECTOR_UI: '1'
      E2E_CONNECTOR_FIXTURE_HOST: ${{ inputs.connector_fixture_host }}
      E2E_CONNECTOR_FIXTURE_PIN: ${{ inputs.connector_fixture_pin }}
      E2E_CONNECTOR_FIXTURE_PORT: ${{ inputs.connector_fixture_port }}
      E2E_VAULT_BINDINGS: '1'
      E2E_ISOLATED_STAGING: '1'
      E2E_ALLOW_WRITES: '1'
      E2E_TRANSFER_WRITABLE: '1'
      E2E_HISTORY_WRITABLE: '1'
      E2E_VAULT_UI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify committed lockfile is present
        run: test -s admin/package-lock.json
      - name: Reproducible dependency installation
        working-directory: admin
        run: npm ci --no-audit --no-fund
      - name: Browser safety preflight
        working-directory: admin
        run: npm run test:e2e:preflight
      - name: Install Chromium
        working-directory: admin
        run: npx playwright install --with-deps chromium
      - name: Execute real browser E2E against staging
        working-directory: admin
        run: bash ../scripts/verify-browser-e2e.sh
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-e2e-failure
          path: |
            admin/test-results/
            admin/playwright-report/
          retention-days: 7
