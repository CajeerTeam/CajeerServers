name: CajeerServers PHP + Nuxt CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  php-smoke:
    name: PHP ${{ matrix.php }} / Smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - name: PHP setup
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, sodium, mbstring, intl, openssl, snmp
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native PHP + Admin static verification
        run: php scripts/verify-release.php
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: SSH transport dependencies
        run: python3 -m pip install -r core/Connector/agents/requirements.txt
      - name: Native SNMP agent dependency
        run: sudo apt-get update -qq && sudo apt-get install -y snmpd
      - name: Connector HTTPS and host protocol integration
        run: |
          python3 tests/connector-https-integration.py
          python3 tests/vmmanager-https-integration.py
          python3 tests/host-transport-integration.py --ssh
          bash tests/snmp-protocol-integration.sh
      - name: Verify dependency lockfiles are present
        run: |
          test -s composer.lock
          test -s admin/package-lock.json
      - name: Install Composer dependencies reproducibly
        run: composer install --no-interaction --no-progress --prefer-dist --no-dev --optimize-autoloader
      - name: Install Nuxt dependencies and compile
        working-directory: admin
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
  postgres-integration:
    name: PostgreSQL 18 / Inventory + IPAM + Topology + History + Transfer
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: cajeer
          POSTGRES_PASSWORD: ci-integration-only
          POSTGRES_DB: cajeer_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd 'pg_isready -U cajeer -d cajeer_test_ci'
          --health-interval 5s --health-timeout 5s --health-retries 15
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd 'redis-cli ping'
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      CAJEER_PG_TEST: '1'
      CAJEER_PG_TEST_DATABASE: cajeer_test_ci
      CAJEER_PG_TEST_HOST: 127.0.0.1
      CAJEER_PG_TEST_PORT: '5432'
      CAJEER_PG_TEST_USERNAME: cajeer
      CAJEER_PG_TEST_PASSWORD: ci-integration-only
      CAJEER_PG_TEST_SSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, sodium, mbstring, intl, openssl
          coverage: none
      - name: PostgreSQL workspace, Inventory CRUD, IPAM and Topology integration
        run: |
          php tests/workspaces-postgres-integration.php
          php tests/inventory-crud-postgres-integration.php
          php tests/ipam-postgres-integration.php
          php tests/topology-postgres-integration.php
          php tests/catalog-postgres-integration.php
          php tests/history-postgres-integration.php
          php tests/transfer-postgres-integration.php
          php tests/cmdb-postgres-integration.php
          php tests/vault-postgres-integration.php
          php tests/vault-crud-postgres-integration.php
          php tests/vault-access-postgres-integration.php
          php tests/vault-rotation-postgres-integration.php
          php tests/vault-bindings-postgres-integration.php
          php tests/connector-reconciliation-postgres-integration.php
          php tests/host-hardware-postgres-integration.php
          php tests/connector-health-postgres-integration.php
          php tests/connector-events-postgres-integration.php
          python3 tests/vmmanager-https-integration.py --postgres
      - name: PostgreSQL client version for encrypted backup/restore
        run: |
          # Match the postgres:18 service. A missing client must fail the integration job.
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/keyrings/postgresql.gpg
          . /etc/os-release
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-18
      - name: Encrypted disaster recovery real PostgreSQL roundtrip
        env:
          PG_DUMP_BINARY: /usr/lib/postgresql/18/bin/pg_dump
          PG_RESTORE_BINARY: /usr/lib/postgresql/18/bin/pg_restore
        run: php tests/backup-postgres-integration.php
