name: CajeerServers PHP + Nuxt CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  php-smoke:
    name: PHP ${{ matrix.php }} / Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - name: PHP setup
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, sodium, mbstring, intl, openssl, snmp, dom, xml, xmlwriter, zip, pcntl, posix
          tools: composer:2.11.2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Build input validation regression
        run: node --test tests/dependency-locks.test.mjs
      - name: Native PHP + Admin static verification
        run: php scripts/verify-release.php
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: SSH transport dependencies (verified wheels)
        run: |
          python3 -m venv "$RUNNER_TEMP/cajeer-agents"
          bash scripts/install-agent-dependencies.sh "$RUNNER_TEMP/cajeer-agents/bin/python"
          echo "$RUNNER_TEMP/cajeer-agents/bin" >> "$GITHUB_PATH"
      - name: Native SNMP agent dependency
        run: sudo apt-get update -qq && sudo apt-get install -y snmpd
      - name: Connector HTTPS and host protocol integration
        run: |
          python3 tests/connector-stability-https-integration.py
          python3 tests/metrics-https-integration.py
          python3 tests/ingestion-https-integration.py
          python3 tests/data-export-https-integration.py
          python3 tests/connector-https-integration.py
          python3 tests/proxmox-profile-https-integration.py
          python3 tests/proxmox-admin-fixture-integration.py
          python3 tests/vmmanager-admin-fixture-integration.py
          python3 tests/os-network-admin-fixture-integration.py
          python3 tests/proxmox-snapshots-https-integration.py
          python3 tests/pbs-backup-https-integration.py
          python3 tests/routeros-https-integration.py
          php tests/system-events-smoke.php
          php tests/network-configuration-backup-smoke.php
          python3 tests/syslog-receiver-integration.py
          python3 tests/linux-events-integration.py
          python3 tests/connector-actions-https-integration.py
          python3 tests/vmmanager-https-integration.py
          python3 tests/vmmanager-power-https-integration.py
          python3 tests/host-transport-integration.py --ssh
          python3 tests/os-network-live-acceptance-integration.py
          bash tests/snmp-protocol-integration.sh
      - name: Build and test TypeScript connector SDK
        run: |
          npm ci --prefix packages/ts-sdk --no-audit --no-fund
          bash tests/connector-sdk-integration.sh
      - name: Build from reviewed lockfiles
        run: bash scripts/build-release.sh
      - name: Upload verified build evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-build-php-${{ matrix.php }}
          path: |
            storage/tmp/release-build.sha256
            storage/tmp/release-build.tar.gz
          if-no-files-found: error
          retention-days: 14
  postgres-integration:
    strategy:
      fail-fast: false
      matrix:
        pg: [17, 18]
    name: PostgreSQL ${{ matrix.pg }} / Connector + Inventory + Recovery
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_USER: cajeer
          POSTGRES_PASSWORD: ci-integration-only
          POSTGRES_DB: cajeer_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd 'pg_isready -U cajeer -d cajeer_test_ci'
          --health-interval 5s --health-timeout 5s --health-retries 15
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd 'redis-cli ping'
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      CAJEER_PG_TEST: '1'
      CAJEER_PG_TEST_DATABASE: cajeer_test_ci
      CAJEER_PG_TEST_HOST: 127.0.0.1
      CAJEER_PG_TEST_PORT: '5432'
      CAJEER_PG_TEST_USERNAME: cajeer
      CAJEER_PG_TEST_PASSWORD: ci-integration-only
      CAJEER_PG_TEST_SSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, sodium, mbstring, intl, openssl, pcntl, posix, snmp
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: SSH transport dependencies (verified wheels)
        run: |
          python3 -m venv "$RUNNER_TEMP/cajeer-agents"
          bash scripts/install-agent-dependencies.sh "$RUNNER_TEMP/cajeer-agents/bin/python"
          echo "$RUNNER_TEMP/cajeer-agents/bin" >> "$GITHUB_PATH"
      - name: SNMP test daemon
        run: sudo apt-get update -qq && sudo apt-get install -y snmpd
      - name: PostgreSQL workspace, Inventory CRUD, IPAM and Topology integration
        run: |
          php tests/database-postgres-integration.php
          php tests/auth-postgres-integration.php
          php tests/security-postgres-integration.php
          php tests/infrastructure-postgres-integration.php
          php tests/admin-postgres-integration.php
          php tests/inventory-postgres-integration.php
          php tests/workspaces-postgres-integration.php
          php tests/inventory-crud-postgres-integration.php
          php tests/ipam-postgres-integration.php
          php tests/topology-postgres-integration.php
          php tests/catalog-postgres-integration.php
          php tests/history-postgres-integration.php
          php tests/transfer-postgres-integration.php
          php tests/cmdb-postgres-integration.php
          php tests/vault-postgres-integration.php
          php tests/vault-crud-postgres-integration.php
          php tests/vault-access-postgres-integration.php
          php tests/vault-rotation-postgres-integration.php
          php tests/vault-bindings-postgres-integration.php
          php tests/proxmox-profile-postgres-integration.php
          php tests/connector-reconciliation-postgres-integration.php
          php tests/host-hardware-postgres-integration.php
          bash tests/snmp-protocol-integration.sh --postgres
          python3 tests/routeros-https-integration.py --postgres
          python3 tests/host-transport-integration.py --ssh --postgres
          php tests/connector-health-postgres-integration.php
          php tests/collection-plans-postgres-integration.php
          php tests/metrics-postgres-integration.php
          php tests/ingestion-postgres-integration.php
          php tests/connector-events-postgres-integration.php
          php tests/connector-actions-postgres-integration.php
          php tests/script-registry-postgres-integration.php
          php tests/script-execution-postgres-integration.php
          python3 tests/connector-actions-https-integration.py
          python3 tests/vmmanager-https-integration.py --postgres
          python3 tests/vmmanager-power-https-integration.py --postgres
          python3 tests/pbs-backup-https-integration.py --postgres
      - name: Redis integration
        env:
          CAJEER_REDIS_TEST: '1'
        run: php tests/infrastructure-redis-integration.php
      - name: PostgreSQL client version for encrypted backup/restore
        run: |
          # Match the PostgreSQL service. A missing client must fail the integration job.
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/keyrings/postgresql.gpg
          . /etc/os-release
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-${{ matrix.pg }}
      - name: Encrypted disaster recovery real PostgreSQL roundtrip
        env:
          PG_DUMP_BINARY: /usr/lib/postgresql/${{ matrix.pg }}/bin/pg_dump
          PG_RESTORE_BINARY: /usr/lib/postgresql/${{ matrix.pg }}/bin/pg_restore
        run: |
          php tests/backup-postgres-integration.php
          php tests/upgrade-postgres-integration.php
  windows-native-agents:
    name: Windows Server / native PowerShell CIM and Event Log
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sodium, openssl
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute production PowerShell probes and PHP normalizers
        run: python tests/windows-native-agent-integration.py
