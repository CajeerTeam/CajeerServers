openapi: 3.1.1
info:
  title: CajeerServers REST API
  version: 0.1.5
  description: 'Реальные HTTP-операции 0.1.5: runtime/system, локальная авторизация и индивидуально отзывные
    сессии/токены. Все приватные данные хранятся в PostgreSQL 17+; запускать после установки и миграции 0004.
    Привилегированные инфраструктурные операции, RBAC и 2FA не опубликованы. Production cookie: __Host-cajeer_session
    (HTTPS); local HTTP: cajeer_session. Токены поддерживают только profile:read, sessions:read, tokens:read;
    операции изменения доступны только cookie-сессиям с X-CSRF-Token. Пользователи с two_factor_enabled=true
    не могут войти до реализации 2FA в следующем релизе.'
servers:
- url: /api/v1
security: []
paths:
  /health:
    get:
      operationId: runtimeHealth
      summary: Проверка готовности PHP runtime и конфигурации
      description: Не проверяет PostgreSQL, Redis, VMmanager, Proxmox или внешние API.
      responses:
        '200':
          description: Runtime готов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Ошибка prerequisite runtime
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '406':
          $ref: '#/components/responses/NotAcceptable'
  /system:
    get:
      operationId: publicSystemInfo
      summary: Публичные сведения о приложении и версии API
      responses:
        '200':
          description: Метаданные приложения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/System'
        '406':
          $ref: '#/components/responses/NotAcceptable'
  /auth/login:
    post:
      operationId: authLogin
      summary: Вход по email/паролю и выдача HttpOnly-сессии
      responses:
        '200':
          description: Создана серверная сессия; csrf_token нужен для мутаций
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Login'
          headers:
            Set-Cookie:
              description: HttpOnly; SameSite=Strict; Secure в production
              schema:
                type: string
        '401': &id001
          $ref: '#/components/responses/Unauthorized'
        '403': &id002
          $ref: '#/components/responses/Forbidden'
        '422': &id003
          $ref: '#/components/responses/UnprocessableEntity'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
        '503': &id005
          $ref: '#/components/responses/ServiceUnavailable'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 255
                password:
                  type: string
                  minLength: 1
                  maxLength: 1024
      description: Аргон2id; единый 401 для неверных реквизитов, блокировка после 6 неуспешных попыток с одной
        пары email/IP за 15 мин.
  /auth/me:
    get:
      operationId: authMe
      summary: Профиль текущего пользователя
      responses:
        '200':
          description: Проверенный пользователь и способ авторизации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Principal'
        '401': *id001
        '403': *id002
        '422': *id003
        '429': *id004
        '503': *id005
      security:
      - sessionAuth: []
      - bearerAuth: []
      description: Bearer требует scope profile:read. Сессионный доступ не требует token scope.
  /auth/csrf:
    get:
      operationId: authCsrf
      summary: Выдать новый CSRF для текущей сессии
      responses:
        '200':
          description: Новый токен, предыдущий становится недействительным
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Csrf'
        '401': *id001
        '403': *id002
        '422': *id003
        '429': *id004
        '503': *id005
      security:
      - sessionAuth: []
  /auth/logout:
    post:
      operationId: authLogout
      summary: Отозвать текущую серверную сессию и cookie
      responses:
        '204':
          description: Операция выполнена, тело ответа отсутствует.
        '401': *id001
        '403': *id002
        '422': *id003
        '429': *id004
        '503': *id005
      security:
      - sessionAuth: []
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        description: CSRF, полученный при login или GET /auth/csrf
        schema:
          type: string
  /auth/password:
    post:
      operationId: authChangePassword
      summary: Сменить пароль и отозвать все сессии и API-токены
      responses:
        '204':
          description: Операция выполнена, тело ответа отсутствует.
        '401': *id001
        '403': *id002
        '422': *id003
        '429': *id004
        '503': *id005
      security:
      - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - current_password
              - new_password
              properties:
                current_password:
                  type: string
                  minLength: 1
                  maxLength: 1024
                new_password:
                  type: string
                  minLength: 14
                  maxLength: 1024
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        description: CSRF, полученный при login или GET /auth/csrf
        schema:
          type: string
  /auth/sessions:
    get:
      operationId: authSessions
      summary: Список действующих сессий пользователя
      responses:
        '200':
          description: Список сессий без секретов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sessions'
        '401': *id001
        '403': *id002
        '422': *id003
        '429': *id004
        '503': *id005
      security:
      - sessionAuth: []
      - bearerAuth: []
      description: Bearer требует scope sessions:read. Сессионный доступ не требует token scope.
  /auth/sessions/{id}:
    delete:
      operationId: authRevokeSession
      summary: Отозвать свою сессию по UUID
      responses:
        '204':
          description: Операция выполнена, тело ответа отсутствует.
        '401': *id001
        '403': *id002
        '422': *id003
        '429': *id004
        '503': *id005
      security:
      - sessionAuth: []
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        description: CSRF, полученный при login или GET /auth/csrf
        schema:
          type: string
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  /auth/tokens:
    get:
      operationId: authTokens
      summary: Список действующих API-токенов без секретов
      responses:
        '200':
          description: Метаданные собственных токенов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
        '401': *id001
        '403': *id002
        '422': *id003
        '429': *id004
        '503': *id005
      security:
      - sessionAuth: []
      - bearerAuth: []
      description: Bearer требует scope tokens:read. Сессионный доступ не требует token scope.
    post:
      operationId: authCreateToken
      summary: Создать ограниченный токен (секрет возвращается один раз)
      responses:
        '201':
          description: Токен показан один раз
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedToken'
        '401': *id001
        '403': *id002
        '422': *id003
        '429': *id004
        '503': *id005
      security:
      - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - name
              - scopes
              - expires_in
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                scopes:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    type: string
                    enum:
                    - profile:read
                    - sessions:read
                    - tokens:read
                expires_in:
                  type: integer
                  minimum: 300
                  maximum: 2592000
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        description: CSRF, полученный при login или GET /auth/csrf
        schema:
          type: string
  /auth/tokens/{id}:
    delete:
      operationId: authRevokeToken
      summary: Отозвать собственный API-токен
      responses:
        '204':
          description: Операция выполнена, тело ответа отсутствует.
        '401': *id001
        '403': *id002
        '422': *id003
        '429': *id004
        '503': *id005
      security:
      - sessionAuth: []
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        description: CSRF, полученный при login или GET /auth/csrf
        schema:
          type: string
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
components:
  schemas:
    Health:
      type: object
      additionalProperties: false
      required:
      - status
      - service
      - scope
      properties:
        status:
          type: string
          enum:
          - ready
          - not_ready
        service:
          type: string
          const: cajeerservers
        scope:
          type: string
          const: runtime
    System:
      type: object
      additionalProperties: false
      required:
      - name
      - version
      - api_version
      - type
      properties:
        name:
          type: string
        version:
          type: string
        api_version:
          type: string
          const: v1
        type:
          type: string
          const: api-first web control shell
    Problem:
      type: object
      additionalProperties: true
      required:
      - type
      - title
      - status
      - code
      - request_id
      properties:
        type:
          type: string
          const: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
        request_id:
          type: string
          pattern: ^[a-f0-9]{24}$
        errors:
          type: array
          items:
            type: object
            required:
            - field
            - message
            properties:
              field:
                type: string
              message:
                type: string
    User:
      type: object
      additionalProperties: false
      required:
      - id
      - email
      - name
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
    Login:
      type: object
      additionalProperties: false
      required:
      - user
      - auth_type
      - csrf_token
      - expires_in
      properties:
        user:
          $ref: '#/components/schemas/User'
        auth_type:
          type: string
          const: session
        csrf_token:
          type: string
        expires_in:
          type: integer
          const: 43200
    Principal:
      type: object
      required:
      - user
      - auth_type
      - scopes
      properties:
        user:
          $ref: '#/components/schemas/User'
        auth_type:
          type: string
          enum:
          - session
          - token
        scopes:
          type: array
          items:
            type: string
    Csrf:
      type: object
      required:
      - csrf_token
      properties:
        csrf_token:
          type: string
    Session:
      type: object
      required:
      - id
      - created_at
      - last_seen_at
      - expires_at
      - current
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
        last_seen_at:
          type: string
        expires_at:
          type: string
        current:
          type: boolean
    Sessions:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Session'
    TokenInfo:
      type: object
      required:
      - id
      - name
      - scopes
      - created_at
      - expires_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        created_at:
          type: string
        expires_at:
          type:
          - string
          - 'null'
        last_used_at:
          type:
          - string
          - 'null'
    IssuedToken:
      allOf:
      - $ref: '#/components/schemas/TokenInfo'
      - type: object
        required:
        - token
        properties:
          token:
            type: string
            description: Секрет выдаётся однократно
    Tokens:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TokenInfo'
  responses:
    NotAcceptable:
      description: The Accept header does not permit JSON
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Требуется действующая сессия или bearer-токен
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Не прошла проверка CSRF, origin или scope
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Некорректное содержимое запроса
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Заблокированы повторные попытки входа
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: Установка не завершена или зависимости недоступны
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: __Host-cajeer_session
      description: Сессия; для локального HTTP имя cookie cajeer_session.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Opaque
      description: at1.<uuid>.<random>, хранится только sha256, поддерживаются лишь 3 read-scopes.
