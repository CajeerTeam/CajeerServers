        '200':
          description: Scoped inventory page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryAssetsResponse'
        '401': &id018
          description: Требуется сессия
        '403': &id019
          description: Нет глобального разрешения или недостаточная роль workspace
