      - name: workspace_id
        in: query
        required: true
        schema: &id023
          type: string
          format: uuid
        description: Доступное рабочее пространство
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 10000
          default: 0
      - name: type
        in: query
        schema: &id029
          type: string
          enum:
          - server
          - hypervisor_node
          - cluster
          - virtual_machine
          - container
          - router
          - workstation
          - other
      - name: status
        in: query
        schema: &id030
          type: string
          enum:
          - unknown
          - online
          - offline
          - maintenance
          - provisioning
          - decommissioned
      - name: search
        in: query
        schema:
          type: string
          maxLength: 100
      - name: tag
        in: query
        schema:
          type: string
          pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
      - name: group_id
        in: query
        schema:
          type: string
          format: uuid
      - name: owner_user_id
        in: query
        schema:
          type: string
          format: uuid
      - name: environment
        in: query
        schema:
          type: string
          maxLength: 64
      - name: source
        in: query
        schema:
          type: string
          maxLength: 120
      - name: os_family
        in: query
        schema:
          type: string
          enum:
          - windows
          - debian
          - ubuntu
          - linux
          - other
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - created_desc
          - updated_desc
          - name_asc
          default: created_desc
      - name: cursor
        in: query
        schema:
          type: string
          description: Opaque keyset cursor; only for created_desc with offset=0
      - name: include_deleted
        in: query
        schema:
          type: string
          enum:
          - '0'
          - '1'
          default: '0'
