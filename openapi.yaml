        in: query
        schema: {type: integer, minimum: 1, maximum: 200, default: 100}
      responses:
        '200':
          description: Узлы, ориентированные рёбра и информация об усечении графа
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      nodes:
                        type: array
                        items:
                          type: object
                          properties:
                            id: {type: string}
                            entity_id: {type: string, format: uuid}
                            kind: {type: string, enum: [asset, network, interface, address]}
                            subtype: {type: string}
                            label: {type: string}
                      edges:
                        type: array
                        items:
                          type: object
                          properties:
                            id: {type: string}
                            source: {type: string}
                            target: {type: string}
                            kind: {type: string}
                            derived: {type: boolean}
                      truncated: {type: boolean}
                      limits: {type: object, additionalProperties: {type: integer}}
        '401': {description: Не авторизован}
        '403': {description: Нет глобального разрешения}
        '404': {description: Workspace недоступен}
        '422': {description: Неверный запрос}
