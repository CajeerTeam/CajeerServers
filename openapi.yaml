      summary: Выполнить discovery зарегистрированного драйвера и атомарно синхронизировать Inventory
      description: Требует MFA grant и permissions inventory.assets.create/update. Импортирует данные Proxmox, VMmanager 6, SSH или WinRM в PostgreSQL через ReconciliationService и HistoryService с устойчивыми external_id и provenance. Ничего не удаляет при исчезновении объекта.
