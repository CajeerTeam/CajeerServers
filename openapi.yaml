          type: string
          enum:
          - csv
          - json
  /inventory/credentials/scopes:
    post:
      operationId: scopeCredential
      summary: Explicitly scope existing credential to workspace (owner, privileged)
      security:
      - sessionAuth: []
      responses:
        '201':
          description: Operation completed
        '401':
          description: Session required
        '403':
          description: RBAC / CSRF / workspace denied
        '404':
          description: Resource unavailable
        '422':
          description: Invalid input
        '503':
          description: Dependency unavailable
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - workspace_id
              - credential_id
              additionalProperties: false
              properties:
                workspace_id:
                  type: string
                  format: uuid
                credential_id:
                  type: string
                  format: uuid
  /inventory/assets/{id}/credential-bindings:
    get:
      operationId: listCredentialBindings
      summary: Read reference IDs only; never encrypted_payload
      security:
      - sessionAuth: []
      responses:
        '200':
          description: Operation completed
        '401':
          description: Session required
        '403':
          description: RBAC / CSRF / workspace denied
        '404':
          description: Resource unavailable
        '422':
          description: Invalid input
        '503':
          description: Dependency unavailable
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: attachCredentialBinding
      summary: Attach existing scoped credential reference
      security:
      - sessionAuth: []
      responses:
        '201':
          description: Operation completed
        '401':
          description: Session required
        '403':
          description: RBAC / CSRF / workspace denied
        '404':
          description: Resource unavailable
        '422':
          description: Invalid input
        '503':
          description: Dependency unavailable
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - credential_id
              - purpose
              additionalProperties: false
              properties:
                credential_id:
                  type: string
                  format: uuid
                purpose:
                  type: string
                  pattern: ^[a-z][a-z0-9_.-]{0,63}$
  /inventory/assets/{id}/credential-bindings/{bindingId}:
    delete:
      operationId: detachCredentialBinding
      summary: Remove credential reference
      security:
      - sessionAuth: []
      responses:
        '204':
          description: Operation completed
        '401':
          description: Session required
        '403':
          description: RBAC / CSRF / workspace denied
        '404':
          description: Resource unavailable
        '422':
          description: Invalid input
        '503':
          description: Dependency unavailable
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: bindingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
components:
  schemas:
    InventoryRelationship:
      type: object
      required: [id, workspace_id, source_asset_id, target_asset_id, kind, version, etag]
      properties:
        id: {type: string, format: uuid}
        workspace_id: {type: string, format: uuid}
        source_asset_id: {type: string, format: uuid}
        target_asset_id: {type: string, format: uuid}
        kind: {type: string, enum: [cluster_contains, hosts, depends_on, connected_to]}
        version: {type: integer, minimum: 1}
        etag: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Health:
      type: object
      additionalProperties: false
      required:
      - status
      - service
      - scope
      properties:
        status:
          type: string
          enum:
          - ready
          - not_ready
        service:
          type: string
          const: cajeerservers
        scope:
          type: string
          const: runtime
    System:
      type: object
      additionalProperties: false
      required:
      - name
      - version
      - api_version
      - type
      properties:
        name:
          type: string
        version:
          type: string
        api_version:
          type: string
          const: v1
        type:
          type: string
          const: api-first web control shell
    Problem:
      type: object
      additionalProperties: true
      required:
      - type
      - title
      - status
      - code
      - request_id
      properties:
        type:
          type: string
          const: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
        request_id:
          type: string
          pattern: ^[a-f0-9]{24}$
        errors:
          type: array
          items:
            type: object
            required:
            - field
            - message
            properties:
              field:
                type: string
              message:
                type: string
    User:
      type: object
      additionalProperties: false
      required:
      - id
      - email
      - name
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
    Login:
      type: object
      additionalProperties: false
      required:
      - user
      - auth_type
      - csrf_token
      - expires_in
      properties:
        user:
          $ref: '#/components/schemas/User'
        auth_type:
          type: string
          const: session
        csrf_token:
          type: string
        expires_in:
          type: integer
          const: 43200
    Principal:
      type: object
      required:
      - user
      - auth_type
      - scopes
      properties:
        user:
          $ref: '#/components/schemas/User'
        auth_type:
          type: string
          enum:
          - session
          - token
        scopes:
          type: array
          items:
            type: string
    Csrf:
      type: object
      required:
      - csrf_token
      properties:
        csrf_token:
          type: string
    Session:
      type: object
      required:
      - id
      - created_at
      - last_seen_at
      - expires_at
      - current
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
        last_seen_at:
          type: string
        expires_at:
          type: string
        current:
          type: boolean
    Sessions:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Session'
    TokenInfo:
      type: object
      required:
      - id
      - name
      - scopes
      - created_at
      - expires_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        created_at:
          type: string
        expires_at:
          type:
          - string
          - 'null'
        last_used_at:
          type:
          - string
          - 'null'
    IssuedToken:
      allOf:
      - $ref: '#/components/schemas/TokenInfo'
      - type: object
        required:
        - token
        properties:
          token:
            type: string
            description: Секрет выдаётся однократно
    Tokens:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TokenInfo'
    SecurityRole:
      type: object
      required:
      - id
      - slug
      - name
      - permissions
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        permissions:
          type: array
          items:
            type: string
    WebhookReceived:
      type: object
      required:
      - id
      - status
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          const: received
    InventoryAsset:
      type: object
      required:
      - id
      - workspace_id
      - type
      - source
      - name
      - status
      - version
      - etag
      properties:
        id: *id023
        workspace_id: *id023
        owner_user_id:
          anyOf:
          - *id023
          - type: 'null'
        type: *id029
        source:
          type: string
        external_id:
          anyOf:
          - type: string
          - type: 'null'
        name:
          type: string
          maxLength: 255
        status:
          type: string
        os_family:
          anyOf:
          - type: string
          - type: 'null'
        ip_addresses:
          type: array
          items:
            type: string
        environment:
          type: string
          description: Workspace-local environment identifier
        tags:
          type: array
          items:
            type: string
        attributes:
          type: object
          additionalProperties: true
        version:
          type: integer
          minimum: 1
        etag:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
        deleted_at:
          anyOf:
          - type: string
          - type: 'null'
    CreateInventoryAsset:
      type: object
      required:
      - workspace_id
      - type
      - name
      additionalProperties: false
      properties:
        workspace_id: *id023
        type: *id029
        name: &id031
          type: string
          minLength: 1
          maxLength: 255
        status: *id030
        os_family: &id032
          anyOf:
          - type: string
            enum:
            - windows
            - debian
            - ubuntu
            - linux
            - other
          - type: 'null'
        ip_addresses: &id033
          type: array
          maxItems: 64
          items:
            type: string
            maxLength: 45
        environment: &id037
          type: string
          pattern: '^[a-z][a-z0-9_-]{0,63}$'
        tags: &id034
          type: array
          maxItems: 50
          items:
            type: string
        attributes: &id035
          type: object
        owner_user_id: &id036
          anyOf:
          - *id023
          - type: 'null'
    UpdateInventoryAsset:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: *id031
        status: *id030
        os_family: *id032
        ip_addresses: *id033
        environment: *id037
        tags: *id034
        attributes: *id035
        owner_user_id: *id036
    InventoryAssetResponse:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/InventoryAsset'
    InventoryAssetsResponse:
      type: object
      required:
      - data
      - total
      - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/InventoryAsset'
        total:
          type: integer
        pagination:
          type: object
          required:
          - limit
          - offset
          - total
          properties:
            limit:
              type: integer
            offset:
              type: integer
            total:
              type: integer
            next_cursor:
              type: [string, "null"]
    CatalogEntry:
      type: object
      required:
      - id
      - workspace_id
      - slug
      - name
      - description
      - version
      - etag
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        version:
          type: integer
        etag:
          type: string
        asset_count:
          type: integer
        created_at:
          type: string
        updated_at:
          type: string
    CatalogEntryResponse:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/CatalogEntry'
    CatalogPage:
      type: object
      required:
      - data
      - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CatalogEntry'
        pagination:
          type: object
          properties:
            limit:
              type: integer
            offset:
              type: integer
            total:
              type: integer
    CreateCatalogEntry:
      type: object
      required:
      - workspace_id
      - slug
      - name
      additionalProperties: false
      properties:
        workspace_id:
          type: string
          format: uuid
        slug:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 128
        description:
          type: string
          maxLength: 1024
    UpdateCatalogEntry:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 128
        description:
          type: string
          maxLength: 1024
  responses:
    NotAcceptable:
      description: The Accept header does not permit JSON
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Требуется действующая сессия или bearer-токен
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Не прошла проверка CSRF, origin или scope
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Некорректное содержимое запроса
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Заблокированы повторные попытки входа
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: Установка не завершена или зависимости недоступны
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    metricsBearer:
      type: http
      scheme: bearer
      description: Отдельный статический scrape token, не API token пользователя.
    sessionAuth:
      type: apiKey
      in: cookie
      name: __Host-cajeer_session
      description: Сессия; для локального HTTP имя cookie cajeer_session.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Opaque
      description: at1.<uuid>.<random>, хранится только sha256, поддерживаются лишь 3 read-scopes.
    webhookHmac:
      type: apiKey
      in: header
      name: X-Cajeer-Signature
      description: sha256=<hex64> HMAC-SHA256 от v1.<unix_timestamp>.<raw_body>; отдельно X-Cajeer-Timestamp, дрейф не
        более 300 секунд.
