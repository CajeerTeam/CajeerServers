          type: string
          pattern: ^"[0-9a-f-]{36}:[1-9][0-9]*"$
  /inventory/assets/{id}/restore-version:
    post:
      operationId: inventoryRestoreRevision
      summary: Создать новую ревизию с безопасными полями исторического manual asset
      security:
      - sessionAuth: []
      responses:
        '200':
          description: Данные сохранены в PostgreSQL и возвращены как JSON
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid request or ETag
        '401':
          description: Unauthenticated
        '403':
          description: Permission denied
        '404':
          description: Not found or inaccessible workspace
        '409':
          description: Conflict
        '412':
          description: Stale If-Match
        '422':
          description: Validation failed
        '428':
          description: If-Match required
        '503':
          description: Service unavailable
      description: Требуется sessionAuth, глобальное RBAC-разрешение, workspace role owner/manager и X-CSRF-Token. Arbitrary
