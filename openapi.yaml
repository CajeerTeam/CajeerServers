      description: Требуется sessionAuth, глобальное RBAC-разрешение, workspace role owner/manager и X-CSRF-Token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - fields
              properties:
                fields:
                  type: object
                  minProperties: 1
                  additionalProperties: false
                  properties:
                    name:
                      type: string
                    status:
                      type: string
                    os_family:
                      type:
                      - string
                      - 'null'
                    ip_addresses:
                      type: array
                      items:
                        type: string
                    tags:
                      type: array
                      items:
                        type: string
                    environment:
                      type: string
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
          pattern: ^"[0-9a-f-]{36}:[1-9][0-9]*"$
  /inventory/assets/{id}/overrides/{field}:
    delete:
      operationId: inventoryClearFieldOverride
      summary: Снять ручной override с поля
      security:
      - sessionAuth: []
      responses:
        '200':
          description: Данные сохранены в PostgreSQL и возвращены как JSON
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid request or ETag
        '401':
          description: Unauthenticated
        '403':
          description: Permission denied
        '404':
          description: Not found or inaccessible workspace
        '409':
          description: Conflict
        '412':
          description: Stale If-Match
        '422':
          description: Validation failed
        '428':
          description: If-Match required
        '503':
          description: Service unavailable
      description: Требуется sessionAuth, глобальное RBAC-разрешение, workspace role owner/manager и X-CSRF-Token.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: field
        in: path
        required: true
        schema:
          type: string
          enum:
          - name
          - status
          - os_family
          - ip_addresses
          - tags
          - environment
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
          pattern: ^"[0-9a-f-]{36}:[1-9][0-9]*"$
  /inventory/assets/{id}/restore-version:
    post:
      operationId: inventoryRestoreRevision
      summary: Создать новую ревизию с безопасными полями исторического manual asset
      security:
      - sessionAuth: []
      responses:
        '200':
          description: Данные сохранены в PostgreSQL и возвращены как JSON
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid request or ETag
        '401':
          description: Unauthenticated
        '403':
          description: Permission denied
        '404':
          description: Not found or inaccessible workspace
        '409':
          description: Conflict
        '412':
          description: Stale If-Match
        '422':
          description: Validation failed
        '428':
          description: If-Match required
        '503':
          description: Service unavailable
      description: Требуется sessionAuth, глобальное RBAC-разрешение, workspace role owner/manager и X-CSRF-Token. Arbitrary
        metadata attributes are not restored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - revision
              properties:
                revision:
                  type: integer
                  minimum: 1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
          pattern: ^"[0-9a-f-]{36}:[1-9][0-9]*"$
  /inventory/imports/preview:
    post:
      operationId: previewInventoryImport
      summary: Dry-run CSV/JSON import preview without writes
      security:
      - sessionAuth: []
      responses:
        '200':
          description: Operation completed
        '401':
          description: Session required
        '403':
          description: RBAC / CSRF / workspace denied
        '404':
          description: Resource unavailable
        '422':
          description: Invalid input
        '503':
          description: Dependency unavailable
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - workspace_id
              - format
              - content
              additionalProperties: false
              properties:
                workspace_id:
                  type: string
                  format: uuid
                format:
                  type: string
                  enum:
                  - csv
                  - json
                content:
                  type: string
                  minLength: 1
                  maxLength: 524288
  /inventory/imports:
    post:
      operationId: submitInventoryImport
      summary: Durable queued import batch
      security:
      - sessionAuth: []
      responses:
        '202':
          description: Operation completed
        '401':
          description: Session required
        '403':
          description: RBAC / CSRF / workspace denied
        '404':
          description: Resource unavailable
        '422':
          description: Invalid input
        '503':
          description: Dependency unavailable
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 120
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - workspace_id
              - format
              - content
              additionalProperties: false
              properties:
                workspace_id:
                  type: string
                  format: uuid
                format:
                  type: string
                  enum:
                  - csv
                  - json
                content:
                  type: string
                  minLength: 1
                  maxLength: 524288
  /inventory/imports/{id}:
    get:
      operationId: inventoryImportStatus
      summary: Read batch progress and row outcomes
      security:
      - sessionAuth: []
      responses:
        '200':
          description: Operation completed
        '401':
          description: Session required
        '403':
          description: RBAC / CSRF / workspace denied
        '404':
          description: Resource unavailable
        '422':
          description: Invalid input
        '503':
          description: Dependency unavailable
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: workspace_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
  /inventory/imports/{id}/dispatch:
    post:
      operationId: dispatchInventoryImport
      summary: Re-enqueue pending batch
      security:
      - sessionAuth: []
      responses:
        '202':
          description: Operation completed
        '401':
          description: Session required
        '403':
          description: RBAC / CSRF / workspace denied
        '404':
          description: Resource unavailable
        '422':
          description: Invalid input
        '503':
          description: Dependency unavailable
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: workspace_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
  /inventory/exports:
    get:
      operationId: exportInventory
      summary: Export max 500 assets, excluding attributes and secrets
      security:
      - sessionAuth: []
      responses:
        '200':
          description: Raw downloadable CSV or JSON array
          content:
            text/csv:
              schema:
                type: string
            application/json:
              schema:
                type: array
                items:
                  type: object
        '401':
          description: Session required
        '403':
          description: RBAC / CSRF / workspace denied
        '404':
          description: Resource unavailable
        '422':
          description: Invalid input
        '503':
          description: Dependency unavailable
        '413':
          description: Export exceeds 500 assets
      parameters:
      - name: workspace_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: format
        in: query
