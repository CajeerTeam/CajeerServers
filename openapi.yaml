  /vault/profiles:
    get:
      operationId: listVaultCredentialProfiles
      summary: Получить реально поддерживаемые типы credentials и обязательные поля
      description: Describes accepted profile field names, never returns values or secrets. Requires authorized server session and vault.credentials.read.
      security:
      - sessionAuth: []
      responses:
        '200':
          description: Список поддерживаемых типов credentials и правил полей
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [type, format, required_fields, optional_fields, description]
                      properties:
                        type: {type: string}
                        format: {type: string, enum: [string, object]}
                        required_fields: {type: array, items: {type: string}}
                        optional_fields: {type: array, items: {type: string}}
                        description: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /vault/credentials:
    get:
      operationId: listVaultCredentials
      summary: Список метаданных зашифрованных credentials одного доступного workspace
      description: Requires session, vault.credentials.read and workspace membership. No ciphertext or plaintext.
      security:
      - sessionAuth: []
      parameters:
      - name: workspace_id
        in: query
        required: true
        schema: {type: string, format: uuid}
      - name: limit
        in: query
        schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      - name: offset
        in: query
        schema: {type: integer, minimum: 0, maximum: 10000, default: 0}
      responses:
        '200':
          description: Метаданные без зашифрованного или открытого секрета
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VaultCredentialPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    post:
      operationId: createVaultCredential
      summary: Создать реальную зашифрованную запись в PostgreSQL
      description: Requires session, CSRF, vault.credentials.create and workspace owner/manager. HTTPS mandatory in production. Secret is write-only.
      security:
      - sessionAuth: []
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [workspace_id, name, type, secret]
              properties:
                workspace_id: {type: string, format: uuid}
                name: {type: string, minLength: 1, maxLength: 255}
                description: {type: string, maxLength: 1024}
                type: {type: string, enum: [generic_secret, api_token, proxmox_api, vmmanager_api, ssh_password, ssh_private_key, winrm, snmp_v2c, snmp_v3]}
                secret: {$ref: '#/components/schemas/VaultSecretInput'}
      responses:
        '201':
          description: Секрет зашифрован и сохранён, возвращены только метаданные
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VaultCredentialResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /vault/credentials/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    get:
      operationId: getVaultCredential
      summary: Метаданные одной доступной записи, без секрета
      security:
      - sessionAuth: []
      responses:
        '200':
          description: Метаданные и ETag
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VaultCredentialResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Credential не найден или недоступен}
    patch:
      operationId: updateVaultCredential
      summary: Изменить безопасные метаданные или active/disabled статус
      security:
      - sessionAuth: []
      parameters:
      - name: If-Match
        in: header
        required: true
        schema: {type: string}
      - name: X-CSRF-Token
        in: header
        required: true
        schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: {type: string, minLength: 1, maxLength: 255}
                description: {type: string, maxLength: 1024}
                status: {type: string, enum: [active, disabled]}
      responses:
        '200':
          description: Обновлённые метаданные
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VaultCredentialResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Credential не найден}
        '412': {description: Устаревший ETag}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '428': {description: If-Match обязателен}
    delete:
      operationId: archiveVaultCredential
      summary: Архивировать credential, предварительно сняв Inventory-привязки
      description: Soft-delete с сохранением ciphertext для аудита. Requires session, CSRF, RBAC, workspace owner/manager and If-Match.
      security:
      - sessionAuth: []
      parameters:
      - name: If-Match
        in: header
        required: true
        schema: {type: string}
      - name: X-CSRF-Token
        in: header
        required: true
        schema: {type: string}
      responses:
        '200':
          description: Архивированные метаданные
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VaultCredentialResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Credential не найден}
        '409': {description: Активные привязки должны быть сняты}
        '412': {description: Устаревший ETag}
        '428': {description: If-Match обязателен}
  /vault/credentials/{id}/secret:
    put:
      operationId: replaceVaultCredentialSecret
      summary: Заменить шифрованное содержимое credential без раскрытия предыдущего
      description: Uses existing immutable credential UUID/workspace/type as AEAD associated data. Never returns plaintext.
      security:
      - sessionAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: If-Match
        in: header
        required: true
        schema: {type: string}
      - name: X-CSRF-Token
        in: header
        required: true
        schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [secret]
              properties:
                secret: {$ref: '#/components/schemas/VaultSecretInput'}
      responses:
        '200':
          description: Новый ciphertext сохранён, версия увеличена
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VaultCredentialResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Credential не найден}
        '412': {description: Устаревший ETag}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '428': {description: If-Match обязателен}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /vault/credentials/{id}/versions:
    get:
      operationId: listVaultCredentialVersions
      summary: Encrypted secret version metadata (no ciphertext/plaintext)
      security:
      - sessionAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200': {description: Version metadata only; pending rows include required_targets, validated_targets, activation_ready}
        '401': {description: Authentication required}
        '403': {description: Permission denied}
        '404': {description: Credential not found}
  /vault/credentials/{id}/rotation:
    post:
      operationId: stageVaultCredentialRotation
      summary: Stage a new encrypted secret version for later explicit activation
      security:
      - sessionAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: If-Match
        in: header
        required: true
        schema: {type: string}
      - name: X-CSRF-Token
        in: header
        required: true
        schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secret]
              additionalProperties: false
              properties:
                secret: {description: Typed secret payload; encrypted before persistence}
      responses:
        '201': {description: Pending encrypted version created; no secrets returned}
        '401': {description: Authentication required}
        '403': {description: Permission denied}
        '409': {description: Rotation already pending or credential not active}
        '412': {description: Stale ETag}
        '422': {description: Invalid profile}
        '428': {description: Missing If-Match}
  /vault/credentials/{id}/rotation/{revision}/activate:
    post:
      operationId: activateVaultCredentialRotation
      summary: Activate a staged secret after mandatory registered-driver verification (when supported)
      description: >-
        For active connector targets with rotation validation capability bound to this credential, confirmed=true
        is NOT sufficient. Every target needs a successful server-side pending-secret
        validation via POST /connectors/targets/{id}/validate-rotation within the last
        10 minutes, for the current credential/target versions. Without such targets,
        the operator confirmation remains the only explicit validation attestation.
      security:
      - sessionAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: revision
        in: path
        required: true
        schema: {type: integer, minimum: 1}
      - name: If-Match
        in: header
        required: true
        schema: {type: string}
      - name: X-CSRF-Token
        in: header
        required: true
        schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmed]
              additionalProperties: false
              properties:
                confirmed: {type: boolean, const: true}
      responses:
        '200': {description: Activated version, retired previous, no secrets returned}
        '409': {description: Pending version missing or fresh connector proof is absent}
        '412': {description: Stale ETag}
        '422': {description: Confirmation required}
  /vault/credentials/{id}/rotation/{revision}/cancel:
    post:
      operationId: cancelVaultCredentialRotation
      summary: Discard staged version without activating it
      security:
      - sessionAuth: []
      parameters:
      - name: id
        in: path
        required: true
