    get:
      operationId: queryMetricSamples
      security: [{sessionAuth: []}]
      description: Half-open UTC range up to 30 days; maximum 2000 points. Decimal values are strings to preserve precision. Rate uses observed counter deltas, treating decreases as resets.
      parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: seriesId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: from, in: query, required: true, schema: {type: string, format: date-time}}
      - {name: to, in: query, required: true, schema: {type: string, format: date-time}}
      - {name: aggregation, in: query, schema: {type: string, enum: [raw, avg, min, max, count, rate], default: raw}}
      - {name: step, in: query, schema: {type: integer, minimum: 1, maximum: 86400, default: 60}}
      responses:
        '200':
          description: Bounded time-series query result.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [series, aggregation, points]
                    properties:
                      series:
                        type: object
                        properties:
                          id: {type: string, format: uuid}
                          metric: {type: string}
                          kind: {type: string, enum: [gauge, counter]}
                          unit: {type: [string, 'null']}
                      aggregation: {type: string, enum: [raw, avg, min, max, count, rate]}
                      points:
                        type: array
                        maxItems: 2000
                        items:
                          type: object
                          required: [timestamp, value]
                          properties:
                            timestamp: {type: string, format: date-time}
                            value: {type: string}
        '401': {description: Session required}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Series or target not found}
        '422': {description: Invalid range, aggregation or query limit exceeded}
