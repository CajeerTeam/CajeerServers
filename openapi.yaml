        '422':
          description: Validation failed
        '429':
          description: Quota exceeded
        '503':
          description: Service unavailable
  /connectors/targets/{id}/data-exports/{exportId}/download:
    get:
      operationId: downloadDataExport
      description: Authorized attachment with SHA-256. No public URLs.
      security:
      - sessionAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: exportId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Export artifact
          headers:
            X-Artifact-SHA256:
              schema:
                type: string
                pattern: ^[a-f0-9]{64}$
            Content-Disposition:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
                format: binary
            application/openmetrics-text:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          description: Session authentication required
        '403':
          description: Permission denied
        '404':
          description: Target, source, or export not found
        '409':
          description: Conflict
        '410':
          description: Artifact expired after seven days
        '422':
          description: Validation failed
        '429':
          description: Quota exceeded
        '503':
          description: Service unavailable
