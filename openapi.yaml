        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Итоги синхронизации, generation, полнота и состояние ресурсов
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/ConnectorDiscoveryResult'}
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Нет asset / binding или удалённый Inventory пуст
        '412':
          description: Конфигурация изменилась; импорт не начался
        '423':
          description: Circuit breaker открыт; дождитесь cooldown или выполните ручной health probe с MFA.
