      responses:
        '202':
          description: Подписанное событие сохранено во входящем журнале
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookReceived'
        '401': *id006
        '403': *id007
        '404': *id008
        '409': *id009
        '422': *id010
        '429': *id011
        '503': *id012
      security:
      - webhookHmac: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      parameters:
      - *id015
      - *id014
      - *id014
      - name: X-Cajeer-Timestamp
        in: header
        required: true
        schema:
          type: string
        description: Unix time seconds
      description: Контент не исполняется; сохраняется в PostgreSQL. HMAC-SHA256 + timestamp ±300 sec + уникальный replay
        digest + лимит 256KiB.
