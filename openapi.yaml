  /connectors/webhooks/{sourceId}/events:
    post:
      operationId: receiveConnectorEvent
      summary: Принять подписанное событие и поставить sync в очередь
      description: Подпись SHA256 HMAC от UTF-8 строки v1.<timestamp>.<source UUID>\n<raw body>. Timestamp ±300 секунд. Повтор того же event_id
        с тем же телом возвращает прежний event/run; другое тело отклоняется. Событие не изменяет Inventory напрямую. Максимум 16 KiB.
      security:
      - connectorWebhookHmac: []
      parameters:
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Cajeer-Timestamp
        in: header
        required: true
        schema:
          type: string
          pattern: ^[1-9][0-9]{9,12}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - event_id
              - type
              properties:
                event_id:
                  type: string
                  pattern: ^[A-Za-z0-9._:-]{1,128}$
                type:
                  enum:
                  - resource.created
                  - resource.updated
                  - resource.deleted
                  - inventory.refresh
                resource_id:
                  type: string
                  minLength: 1
                  maxLength: 180
              if:
                properties:
                  type:
                    enum:
                    - resource.created
                    - resource.updated
                    - resource.deleted
              then:
                required:
                - resource_id
      responses:
        '202':
          description: Событие принято либо повторно подтверждено
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required:
                    - id
                    - run_id
                    - deduplicated
                    properties:
                      id:
                        type: string
                        format: uuid
                      run_id:
                        type: string
                        format: uuid
                      deduplicated:
                        type: boolean
        '400':
          description: Невалидный JSON
        '401':
          description: Неверная подпись или отозванный источник
        '403':
          description: Недействующее разрешение
        '409':
          description: Конфликт идентификатора события или состояния коннектора
        '413':
          description: Тело слишком велико
        '415':
          description: Требуется application/json
        '422':
          description: Некорректное событие
        '429':
          description: Лимит запросов или очередь заполнена; повторить позже
        '503':
          description: Сервис недоступен
