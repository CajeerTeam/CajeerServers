          maxLength: 120
      - name: os_family
        in: query
        schema:
          type: string
          enum:
          - windows
          - debian
          - ubuntu
          - linux
          - other
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - created_desc
          - updated_desc
          - name_asc
          default: created_desc
      - name: cursor
        in: query
        schema:
          type: string
          description: Opaque keyset cursor; only for created_desc with offset=0
