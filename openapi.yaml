  /connectors/targets/{id}/resources/resolve:
    post:
      operationId: resolveConnectorResourceConflict
      summary: Явно связать ручной asset или разрешить отдельное создание
      description: Требует CSRF, If-Match, Workspace manager/owner и inventory.assets.create/update. generation должна совпадать с последней версией конфликта. Не выполняет удалённый вызов и не создаёт asset до следующей синхронизации.
      security:
      - sessionAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: If-Match
        in: header
        required: true
        schema: {type: string}
      - name: X-CSRF-Token
        in: header
        required: true
        schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [external_id, mode, generation]
              additionalProperties: false
              properties:
                external_id: {type: string, minLength: 1, maxLength: 180}
                mode: {type: string, enum: [link, create]}
                generation: {type: integer, minimum: 1}
                asset_id: {type: string, format: uuid}
              if:
                properties:
                  mode: {const: link}
              then:
                required: [asset_id]
              else:
                not:
                  required: [asset_id]
      responses:
        '200':
          description: Решение сохранено; новая синхронизация применит его
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [external_id, asset_id, allow_create]
                    properties:
                      external_id: {type: string}
                      asset_id: {type: [string, 'null'], format: uuid}
                      allow_create: {type: boolean}
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Target недоступен
        '409':
          description: Конфликт уже разрешён, изменился или asset занят
        '412':
          description: Устаревший ETag target
        '422':
          description: Некорректная привязка или входные данные
        '428':
          description: Требуется If-Match
  /connectors/targets/{id}/inspect:
    post:
      operationId: inspectProxmoxConnector
      summary: Выполнить discovery зарегистрированного драйвера и получить сводку Inventory
      description: Использует одноразовый Vault grant после отдельного password+TOTP step-up; нужен связанный активный Inventory asset и две credential bindings. Секреты и сырой ответ не выдаются. TLS peer и CA проверяются. Proxmox VE, VMmanager 6, SSH, WinRM и SNMP исполняются через общий Registry. SNMPv3 authPriv или явно разрешённый SNMPv2c выполняют только GET/GETNEXT. SSH проверяет known_hosts; WinRM требует Basic поверх проверенного HTTPS.
      security:
      - sessionAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Предпросмотр изменений, конфликтов и счётчики; без записи Inventory
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/ConnectorDiscoveryResult'}
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Неполная настройка, отсутствует Inventory binding или нет активного credential
        '412':
          description: Устаревшая версия конфигурации
        '423':
          description: Circuit breaker открыт; дождитесь cooldown или выполните ручной health probe с MFA.
        '428':
          description: Требуется If-Match
        '501':
          description: Исполняемый драйвер отсутствует
        '502':
          description: Удалённое подключение или TLS проверка не прошли
  /connectors/targets/{id}/validate-rotation:
    post:
      operationId: validatePendingProxmoxCredential
      summary: Проверить ожидающую версию секрета через зарегистрированный драйвер
      description: >-
        Требует активной MFA-сессии и одноразового grant, выданного через
        POST /vault/credentials/{id}/authorize-use. Читает исключительно
        зашифрованную pending-версию, выполняет проверку зарегистрированным драйвером,
        не изменяет Inventory и не возвращает секрет. Успех сохраняется на
        10 минут и привязан к версиям credential и connector target. Только
        после подтверждения всех активных targets, требующих проверки разрешена активация.
