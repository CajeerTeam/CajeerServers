openapi: 3.1.1
info:
  title: CajeerServers REST API
  version: 0.1.7
  description: 'CajeerServers 0.1.7: реальная PostgreSQL-аутентификация, scoped API tokens, RBAC с проверками на
    сервере, TOTP MFA и одноразовые recovery codes, security audit (append-only), подписанный вебхук-входящий журнал
    с защитой от replay. HTTPS обязателен в production. Для state-changing security API нужны cookie-сессия и X-CSRF-Token.
    Bearer-токены не дают доступа к security mutations. Перед использованием очереди и планировщика нужна миграция 0006; инфраструктурные
    действия Proxmox/VMmanager ещё не опубликованы. Webhook events принимаются и сохраняются, но не исполняются.'
servers:
- url: /api/v1
security: []
paths:
  /health:
    get:
      operationId: runtimeHealth
      summary: Проверка готовности PHP runtime и конфигурации
      description: Не проверяет PostgreSQL, Redis, VMmanager, Proxmox или внешние API.
      responses:
        '200':
          description: Runtime готов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Ошибка prerequisite runtime
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '406':
          $ref: '#/components/responses/NotAcceptable'
  /system:
    get:
      operationId: publicSystemInfo
      summary: Публичные сведения о приложении и версии API
      responses:
        '200':
          description: Метаданные приложения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/System'
        '406':
          $ref: '#/components/responses/NotAcceptable'
  /auth/login:
    post:
      operationId: authLogin
      summary: Вход по email/паролю, при включённой MFA — TOTP/recovery code
      responses:
        '200':
          description: Создана серверная сессия; csrf_token нужен для мутаций
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Login'
          headers:
            Set-Cookie:
              description: HttpOnly; SameSite=Strict; Secure в production
              schema:
                type: string
        '401': &id001
          $ref: '#/components/responses/Unauthorized'
        '403': &id002
          $ref: '#/components/responses/Forbidden'
        '422': &id003
          $ref: '#/components/responses/UnprocessableEntity'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
        '503': &id005
          $ref: '#/components/responses/ServiceUnavailable'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 255
                password:
                  type: string
                  minLength: 1
                  maxLength: 1024
                mfa_code:
                  type: string
                  minLength: 6
                  maxLength: 64
                  description: TOTP из authenticator либо recovery code; не сохраняется в логах.
      description: Argon2id; для пользователей с MFA обязателен mfa_code (6-значный TOTP либо одноразовый recovery
        code). Единый 401 при неверных учётных данных, rate limiting по account+IP и общему IP.
  /auth/me:
    get:
      operationId: authMe
      summary: Профиль текущего пользователя
      responses:
        '200':
          description: Проверенный пользователь и способ авторизации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Principal'
        '401': *id001
        '403': *id002
        '422': *id003
        '429': *id004
        '503': *id005
      security:
      - sessionAuth: []
      - bearerAuth: []
      description: Bearer требует scope profile:read. Сессионный доступ не требует token scope.
  /auth/csrf:
    get:
      operationId: authCsrf
      summary: Выдать новый CSRF для текущей сессии
      responses:
        '200':
          description: Новый токен, предыдущий становится недействительным
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Csrf'
        '401': *id001
        '403': *id002
        '422': *id003
        '429': *id004
        '503': *id005
      security:
      - sessionAuth: []
  /auth/logout:
    post:
      operationId: authLogout
      summary: Отозвать текущую серверную сессию и cookie
      responses:
        '204':
          description: Операция выполнена, тело ответа отсутствует.
        '401': *id001
        '403': *id002
        '422': *id003
        '429': *id004
        '503': *id005
      security:
      - sessionAuth: []
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        description: CSRF, полученный при login или GET /auth/csrf
        schema:
          type: string
  /auth/password:
    post:
      operationId: authChangePassword
      summary: Сменить пароль и отозвать все сессии и API-токены
      responses:
        '204':
          description: Операция выполнена, тело ответа отсутствует.
        '401': *id001
        '403': *id002
        '422': *id003
        '429': *id004
        '503': *id005
      security:
      - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - current_password
              - new_password
              properties:
                current_password:
                  type: string
                  minLength: 1
                  maxLength: 1024
                new_password:
                  type: string
                  minLength: 14
                  maxLength: 1024
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        description: CSRF, полученный при login или GET /auth/csrf
        schema:
          type: string
  /auth/sessions:
    get:
      operationId: authSessions
      summary: Список действующих сессий пользователя
      responses:
        '200':
          description: Список сессий без секретов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sessions'
        '401': *id001
        '403': *id002
        '422': *id003
        '429': *id004
        '503': *id005
      security:
      - sessionAuth: []
      - bearerAuth: []
      description: Bearer требует scope sessions:read. Сессионный доступ не требует token scope.
  /auth/sessions/{id}:
    delete:
      operationId: authRevokeSession
      summary: Отозвать свою сессию по UUID
      responses:
        '204':
          description: Операция выполнена, тело ответа отсутствует.
        '401': *id001
        '403': *id002
        '422': *id003
        '429': *id004
        '503': *id005
      security:
      - sessionAuth: []
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        description: CSRF, полученный при login или GET /auth/csrf
        schema:
          type: string
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  /auth/tokens:
    get:
      operationId: authTokens
      summary: Список действующих API-токенов без секретов
      responses:
        '200':
          description: Метаданные собственных токенов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
        '401': *id001
        '403': *id002
        '422': *id003
        '429': *id004
        '503': *id005
      security:
      - sessionAuth: []
      - bearerAuth: []
      description: Bearer требует scope tokens:read. Сессионный доступ не требует token scope.
    post:
      operationId: authCreateToken
      summary: Создать ограниченный токен (секрет возвращается один раз)
      responses:
        '201':
          description: Токен показан один раз
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedToken'
        '401': *id001
        '403': *id002
        '422': *id003
        '429': *id004
        '503': *id005
      security:
      - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - name
              - scopes
              - expires_in
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                scopes:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    type: string
                    enum:
                    - profile:read
                    - sessions:read
                    - tokens:read
                expires_in:
                  type: integer
                  minimum: 300
                  maximum: 2592000
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        description: CSRF, полученный при login или GET /auth/csrf
        schema:
          type: string
  /auth/tokens/{id}:
    delete:
      operationId: authRevokeToken
      summary: Отозвать собственный API-токен
      responses:
        '204':
          description: Операция выполнена, тело ответа отсутствует.
        '401': *id001
        '403': *id002
        '422': *id003
        '429': *id004
        '503': *id005
      security:
      - sessionAuth: []
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        description: CSRF, полученный при login или GET /auth/csrf
        schema:
          type: string
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  /auth/mfa:
    get:
      operationId: mfaStatus
      summary: Статус TOTP и остаток recovery codes
      responses:
        '200':
          description: Данные
          content:
            application/json:
              schema:
                type: object
        '401': &id006
          description: Unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403': &id007
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404': &id008
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409': &id009
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422': &id010
          description: Validation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429': &id011
          description: Rate limited
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503': &id012
          description: Service unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security: &id013
      - sessionAuth: []
  /auth/mfa/enroll:
    post:
      operationId: mfaEnroll
      summary: Начать включение 2FA; секрет выдаётся однократно
      responses:
        '201':
          description: Данные
          content:
            application/json:
              schema:
                type: object
        '401': *id006
        '403': *id007
        '404': *id008
        '409': *id009
        '422': *id010
        '429': *id011
        '503': *id012
      security: *id013
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                password:
                  type: string
                  minLength: 1
                  maxLength: 1024
              required:
              - password
      parameters:
      - &id014
        name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
        description: Текущий CSRF токен сессии
  /auth/mfa/confirm:
    post:
      operationId: mfaConfirm
      summary: Подтвердить TOTP и получить десять recovery codes
      responses:
        '201':
          description: Данные
          content:
            application/json:
              schema:
                type: object
        '401': *id006
        '403': *id007
        '404': *id008
        '409': *id009
        '422': *id010
        '429': *id011
        '503': *id012
      security: *id013
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                code:
                  type: string
                  minLength: 6
                  maxLength: 64
              required:
              - code
      parameters:
      - *id014
  /auth/mfa/disable:
    post:
      operationId: mfaDisable
      summary: Отключить 2FA и отозвать все сессии и API токены
      responses:
        '204':
          description: Действие завершено, тело отсутствует
        '401': *id006
        '403': *id007
        '404': *id008
        '409': *id009
        '422': *id010
        '429': *id011
        '503': *id012
      security: *id013
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                password:
                  type: string
                code:
                  type: string
              required:
              - password
              - code
      parameters:
      - *id014
  /security/roles:
    get:
      operationId: securityRoles
      summary: Просмотр ролей и их permissions
      responses:
        '200':
          description: Данные
          content:
            application/json:
              schema:
                type: object
        '401': *id006
        '403': *id007
        '404': *id008
        '409': *id009
        '422': *id010
        '429': *id011
        '503': *id012
      security: *id013
    post:
      operationId: securityCreateRole
      summary: Создать роль с разрешениями, которыми обладает создатель
      responses:
        '201':
          description: Данные
          content:
            application/json:
              schema:
                type: object
        '401': *id006
        '403': *id007
        '404': *id008
        '409': *id009
        '422': *id010
        '429': *id011
        '503': *id012
      security: *id013
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                slug:
                  type: string
                  pattern: ^[a-z][a-z0-9_-]{2,63}$
                name:
                  type: string
                permissions:
                  type: array
                  items:
                    type: string
              required:
              - slug
              - name
              - permissions
      parameters:
      - *id014
  /security/users:
    get:
      operationId: securityUsers
      summary: Пользователи и роли
      responses:
        '200':
          description: Данные
          content:
            application/json:
              schema:
                type: object
        '401': *id006
        '403': *id007
        '404': *id008
        '409': *id009
        '422': *id010
        '429': *id011
        '503': *id012
      security: *id013
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          maximum: 100
      - name: offset
        in: query
        schema:
          type: integer
    post:
      operationId: securityCreateUser
      summary: Создать пользователя без привилегий
      responses:
        '201':
          description: Данные
          content:
            application/json:
              schema:
                type: object
        '401': *id006
        '403': *id007
        '404': *id008
        '409': *id009
        '422': *id010
        '429': *id011
        '503': *id012
      security: *id013
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
                name:
                  type: string
                password:
                  type: string
                  minLength: 14
              required:
              - email
              - name
              - password
      parameters:
      - *id014
  /security/users/{id}:
    patch:
      operationId: securitySetUserActive
      summary: Включить/выключить учётную запись, отозвать доступ при отключении
      responses:
        '204':
          description: Действие завершено, тело отсутствует
        '401': *id006
        '403': *id007
        '404': *id008
        '409': *id009
        '422': *id010
        '429': *id011
        '503': *id012
      security: *id013
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                active:
                  type: boolean
              required:
              - active
      parameters: &id017
      - &id015
        name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - *id014
      - *id014
  /security/users/{id}/roles/{slug}:
    post:
      operationId: securityGrantRole
      summary: Назначить роль без расширения собственных полномочий
      responses:
        '204':
          description: Действие завершено, тело отсутствует
        '401': *id006
        '403': *id007
        '404': *id008
        '409': *id009
        '422': *id010
        '429': *id011
        '503': *id012
      security: *id013
      parameters:
      - *id015
      - *id014
      - &id016
        name: slug
        in: path
        required: true
        schema:
          type: string
      - *id014
    delete:
      operationId: securityRevokeRole
      summary: Отозвать роль с защитой последнего администратора
      responses:
        '204':
          description: Действие завершено, тело отсутствует
        '401': *id006
        '403': *id007
        '404': *id008
        '409': *id009
        '422': *id010
        '429': *id011
        '503': *id012
      security: *id013
      parameters:
      - *id015
      - *id014
      - *id016
      - *id014
  /security/audit:
    get:
      operationId: securityAudit
      summary: Чтение неизменяемого журнала аудита
      responses:
        '200':
          description: Данные
          content:
            application/json:
              schema:
                type: object
        '401': *id006
        '403': *id007
        '404': *id008
        '409': *id009
        '422': *id010
        '429': *id011
        '503': *id012
      security: *id013
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - name: before
        in: query
        schema:
          type: string
          format: date-time
  /security/webhooks:
    get:
      operationId: securityWebhookSources
      summary: Просмотр источников без секретов
      responses:
        '200':
          description: Данные
          content:
            application/json:
              schema:
                type: object
        '401': *id006
        '403': *id007
        '404': *id008
        '409': *id009
        '422': *id010
        '429': *id011
        '503': *id012
      security: *id013
    post:
      operationId: securityWebhookCreate
      summary: Создание источника, секрет возвращается однократно
      responses:
        '201':
          description: Данные
          content:
            application/json:
              schema:
                type: object
        '401': *id006
        '403': *id007
        '404': *id008
        '409': *id009
        '422': *id010
        '429': *id011
        '503': *id012
      security: *id013
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
              required:
              - name
      parameters:
      - *id014
  /security/webhooks/{id}:
    delete:
      operationId: securityWebhookRevoke
      summary: Отзыв секрета webhook
      responses:
        '204':
          description: Действие завершено, тело отсутствует
        '401': *id006
        '403': *id007
        '404': *id008
        '409': *id009
        '422': *id010
        '429': *id011
        '503': *id012
      security: *id013
      parameters: *id017
  /security/webhooks/events:
    get:
      operationId: securityWebhookEvents
      summary: Перечень сохранённых входящих событий без содержимого payload
      responses:
        '200':
          description: Данные
          content:
            application/json:
              schema:
                type: object
        '401': *id006
        '403': *id007
        '404': *id008
        '409': *id009
        '422': *id010
        '429': *id011
        '503': *id012
      security: *id013
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
  /webhooks/{id}/events:
    post:
      operationId: webhookReceive
      summary: Проверить подпись и сохранить JSON-событие без исполнения
      responses:
        '202':
          description: Подписанное событие сохранено во входящем журнале
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookReceived'
        '401': *id006
        '403': *id007
        '404': *id008
        '409': *id009
        '422': *id010
        '429': *id011
        '503': *id012
      security:
      - webhookHmac: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      parameters:
      - *id015
      - *id014
      - *id014
      - name: X-Cajeer-Timestamp
        in: header
        required: true
        schema:
          type: string
        description: Unix time seconds
      description: Контент не исполняется; сохраняется в PostgreSQL. HMAC-SHA256 + timestamp ±300 sec + уникальный
        replay digest + лимит 256KiB.
components:
  schemas:
    Health:
      type: object
      additionalProperties: false
      required:
      - status
      - service
      - scope
      properties:
        status:
          type: string
          enum:
          - ready
          - not_ready
        service:
          type: string
          const: cajeerservers
        scope:
          type: string
          const: runtime
    System:
      type: object
      additionalProperties: false
      required:
      - name
      - version
      - api_version
      - type
      properties:
        name:
          type: string
        version:
          type: string
        api_version:
          type: string
          const: v1
        type:
          type: string
          const: api-first web control shell
    Problem:
      type: object
      additionalProperties: true
      required:
      - type
      - title
      - status
      - code
      - request_id
      properties:
        type:
          type: string
          const: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
        request_id:
          type: string
          pattern: ^[a-f0-9]{24}$
        errors:
          type: array
          items:
            type: object
            required:
            - field
            - message
            properties:
              field:
                type: string
              message:
                type: string
    User:
      type: object
      additionalProperties: false
      required:
      - id
      - email
      - name
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
    Login:
      type: object
      additionalProperties: false
      required:
      - user
      - auth_type
      - csrf_token
      - expires_in
      properties:
        user:
          $ref: '#/components/schemas/User'
        auth_type:
          type: string
          const: session
        csrf_token:
          type: string
        expires_in:
          type: integer
          const: 43200
    Principal:
      type: object
      required:
      - user
      - auth_type
      - scopes
      properties:
        user:
          $ref: '#/components/schemas/User'
        auth_type:
          type: string
          enum:
          - session
          - token
        scopes:
          type: array
          items:
            type: string
    Csrf:
      type: object
      required:
      - csrf_token
      properties:
        csrf_token:
          type: string
    Session:
      type: object
      required:
      - id
      - created_at
      - last_seen_at
      - expires_at
      - current
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
        last_seen_at:
          type: string
        expires_at:
          type: string
        current:
          type: boolean
    Sessions:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Session'
    TokenInfo:
      type: object
      required:
      - id
      - name
      - scopes
      - created_at
      - expires_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        created_at:
          type: string
        expires_at:
          type:
          - string
          - 'null'
        last_used_at:
          type:
          - string
          - 'null'
    IssuedToken:
      allOf:
      - $ref: '#/components/schemas/TokenInfo'
      - type: object
        required:
        - token
        properties:
          token:
            type: string
            description: Секрет выдаётся однократно
    Tokens:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TokenInfo'
    SecurityRole:
      type: object
      required:
      - id
      - slug
      - name
      - permissions
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        permissions:
          type: array
          items:
            type: string
    WebhookReceived:
      type: object
      required:
      - id
      - status
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          const: received
  responses:
    NotAcceptable:
      description: The Accept header does not permit JSON
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Требуется действующая сессия или bearer-токен
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Не прошла проверка CSRF, origin или scope
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Некорректное содержимое запроса
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Заблокированы повторные попытки входа
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: Установка не завершена или зависимости недоступны
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: __Host-cajeer_session
      description: Сессия; для локального HTTP имя cookie cajeer_session.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Opaque
      description: at1.<uuid>.<random>, хранится только sha256, поддерживаются лишь 3 read-scopes.
    webhookHmac:
      type: apiKey
      in: header
      name: X-Cajeer-Signature
      description: sha256=<hex64> HMAC-SHA256 от v1.<unix_timestamp>.<raw_body>; отдельно X-Cajeer-Timestamp, дрейф
        не более 300 секунд.
