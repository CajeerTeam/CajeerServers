openapi: 3.1.1
info:
  title: CajeerServers REST API
  version: 0.6.3
  description: 'CajeerServers 0.5.7: signed external data ingestion, durable inbox and time series.'
servers:
- url: /api/v1
security: []
paths:
  /health:
    get:
      operationId: runtimeHealth
      summary: Проверка готовности PHP runtime и конфигурации
      description: Не проверяет PostgreSQL, Redis, VMmanager, Proxmox или внешние API.
      responses:
        '200':
          description: Runtime готов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Ошибка prerequisite runtime
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '406':
          $ref: '#/components/responses/NotAcceptable'
  /live:
    get:
      operationId: processLiveness
      summary: Liveness HTTP/PHP процесса, не зависит от PostgreSQL и Redis
      security: []
      responses:
        '200':
          description: Веб-процесс отвечает
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - service
                - scope
                properties:
                  status:
                    type: string
                    const: alive
                  service:
                    type: string
                  scope:
                    type: string
                    const: process
  /ready:
    get:
      operationId: dependencyReadiness
      summary: Готовность runtime, установки, PostgreSQL, Redis, очереди, планировщика и storage
      description: Публичный endpoint возвращает только агрегат, без адресов хостов и деталей ошибок. S3 storage проверяется
        реальной временной записью/чтением/удалением; local storage — проверкой каталога.
      security: []
      responses:
        '200':
          description: Все обязательные зависимости доступны
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - service
                - scope
                properties:
                  status:
                    type: string
                    const: ready
                  service:
                    type: string
                  scope:
                    type: string
                    const: dependencies
        '503':
          description: Не готова хотя бы одна обязательная зависимость
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - service
                - scope
                properties:
                  status:
                    type: string
                    const: not_ready
                  service:
                    type: string
                  scope:
                    type: string
                    const: dependencies
  /metrics:
    get:
      operationId: prometheusScrape
      summary: Защищённый Prometheus exposition format
      description: Отключён по умолчанию. Требует PROMETHEUS_ENABLED=true и PROMETHEUS_SCRAPE_TOKEN длиной не менее 32
        символов. Bearer-token проверяется по constant-time comparison; в production необходим HTTPS. Счётчики HTTP/queue
        сохраняются локально на инстансе, метки ограничены; gauge dependency_up получает фактический результат проверки
        зависимостей.
      security:
      - metricsBearer: []
      responses:
        '200':
          description: Текстовые метрики Prometheus 0.0.4
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Не передан или неверен scrape bearer token
        '403':
          description: В production требуется HTTPS
        '404':
          description: Экспорт метрик отключён или не сконфигурирован
  /system:
    get:
      operationId: publicSystemInfo
      summary: Публичные сведения о приложении и версии API
      responses:
        '200':
          description: Метаданные приложения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/System'
        '406':
          $ref: '#/components/responses/NotAcceptable'
  /auth/login:
    post:
      operationId: authLogin
      summary: Вход по email/паролю, при включённой MFA — TOTP/recovery code
      responses:
        '200':
          description: Создана серверная сессия; csrf_token нужен для мутаций
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Login'
          headers:
            Set-Cookie:
              description: HttpOnly; SameSite=Strict; Secure в production
              schema:
                type: string
        '401': &id001
          $ref: '#/components/responses/Unauthorized'
        '403': &id002
          $ref: '#/components/responses/Forbidden'
        '422': &id003
          $ref: '#/components/responses/UnprocessableEntity'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
        '503': &id005
          $ref: '#/components/responses/ServiceUnavailable'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 255
                password:
                  type: string
                  minLength: 1
                  maxLength: 1024
                mfa_code:
                  type: string
                  minLength: 6
                  maxLength: 64
                  description: TOTP из authenticator либо recovery code; не сохраняется в логах.
      description: Argon2id; для пользователей с MFA обязателен mfa_code (6-значный TOTP либо одноразовый recovery code).
        Единый 401 при неверных учётных данных, rate limiting по account+IP и общему IP.
  /auth/me:
    get:
      operationId: authMe
      summary: Профиль текущего пользователя
      responses:
        '200':
          description: Проверенный пользователь и способ авторизации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Principal'
        '401': *id001
        '403': *id002
        '422': *id003
        '429': *id004
        '503': *id005
      security:
      - sessionAuth: []
      - bearerAuth: []
      description: Bearer требует scope profile:read. Сессионный доступ не требует token scope.
  /auth/csrf:
    get:
      operationId: authCsrf
      summary: Выдать новый CSRF для текущей сессии
      responses:
        '200':
          description: Новый токен, предыдущий становится недействительным
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Csrf'
        '401': *id001
        '403': *id002
        '422': *id003
        '429': *id004
        '503': *id005
      security:
      - sessionAuth: []
  /auth/logout:
    post:
      operationId: authLogout
      summary: Отозвать текущую серверную сессию и cookie
      responses:
        '204':
          description: Операция выполнена, тело ответа отсутствует.
        '401': *id001
        '403': *id002
        '422': *id003
        '429': *id004
        '503': *id005
      security:
      - sessionAuth: []
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        description: CSRF, полученный при login или GET /auth/csrf
        schema:
          type: string
  /auth/password:
    post:
      operationId: authChangePassword
      summary: Сменить пароль и отозвать все сессии и API-токены
      responses:
        '204':
          description: Операция выполнена, тело ответа отсутствует.
        '401': *id001
        '403': *id002
        '422': *id003
        '429': *id004
        '503': *id005
      security:
      - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - current_password
              - new_password
              properties:
                current_password:
                  type: string
                  minLength: 1
                  maxLength: 1024
                new_password:
                  type: string
                  minLength: 14
                  maxLength: 1024
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        description: CSRF, полученный при login или GET /auth/csrf
        schema:
          type: string
  /auth/sessions:
    get:
      operationId: authSessions
      summary: Список действующих сессий пользователя
      responses:
        '200':
          description: Список сессий без секретов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sessions'
        '401': *id001
        '403': *id002
        '422': *id003
        '429': *id004
        '503': *id005
      security:
      - sessionAuth: []
      - bearerAuth: []
      description: Bearer требует scope sessions:read. Сессионный доступ не требует token scope.
  /auth/sessions/{id}:
    delete:
      operationId: authRevokeSession
      summary: Отозвать свою сессию по UUID
      responses:
        '204':
          description: Операция выполнена, тело ответа отсутствует.
        '401': *id001
        '403': *id002
        '422': *id003
        '429': *id004
        '503': *id005
      security:
      - sessionAuth: []
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        description: CSRF, полученный при login или GET /auth/csrf
        schema:
          type: string
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  /auth/tokens:
    get:
      operationId: authTokens
      summary: Список действующих API-токенов без секретов
      responses:
        '200':
          description: Метаданные собственных токенов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
        '401': *id001
        '403': *id002
        '422': *id003
        '429': *id004
        '503': *id005
      security:
      - sessionAuth: []
      - bearerAuth: []
      description: Bearer требует scope tokens:read. Сессионный доступ не требует token scope.
    post:
      operationId: authCreateToken
      summary: Создать ограниченный токен (секрет возвращается один раз)
      responses:
        '201':
          description: Токен показан один раз
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedToken'
        '401': *id001
        '403': *id002
        '422': *id003
        '429': *id004
        '503': *id005
      security:
      - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - name
              - scopes
              - expires_in
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                scopes:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    type: string
                    enum:
                    - profile:read
                    - sessions:read
                    - tokens:read
                expires_in:
                  type: integer
                  minimum: 300
                  maximum: 2592000
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        description: CSRF, полученный при login или GET /auth/csrf
        schema:
          type: string
  /auth/tokens/{id}:
    delete:
      operationId: authRevokeToken
      summary: Отозвать собственный API-токен
      responses:
        '204':
          description: Операция выполнена, тело ответа отсутствует.
        '401': *id001
        '403': *id002
        '422': *id003
        '429': *id004
        '503': *id005
      security:
      - sessionAuth: []
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        description: CSRF, полученный при login или GET /auth/csrf
        schema:
          type: string
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  /auth/mfa:
    get:
      operationId: mfaStatus
      summary: Статус TOTP и остаток recovery codes
      responses:
        '200':
          description: Данные
          content:
            application/json:
              schema:
                type: object
        '401': &id006
          description: Unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403': &id007
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404': &id008
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409': &id009
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422': &id010
          description: Validation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429': &id011
          description: Rate limited
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503': &id012
          description: Service unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security: &id013
      - sessionAuth: []
  /auth/mfa/enroll:
    post:
      operationId: mfaEnroll
      summary: Начать включение 2FA; секрет выдаётся однократно
      responses:
        '201':
          description: Данные
          content:
            application/json:
              schema:
                type: object
        '401': *id006
        '403': *id007
        '404': *id008
        '409': *id009
        '422': *id010
        '429': *id011
        '503': *id012
      security: *id013
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                password:
                  type: string
                  minLength: 1
                  maxLength: 1024
              required:
              - password
      parameters:
      - &id014
        name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
        description: Текущий CSRF токен сессии
  /auth/mfa/confirm:
    post:
      operationId: mfaConfirm
      summary: Подтвердить TOTP и получить десять recovery codes
      responses:
        '201':
          description: Данные
          content:
            application/json:
              schema:
                type: object
        '401': *id006
        '403': *id007
        '404': *id008
        '409': *id009
        '422': *id010
        '429': *id011
        '503': *id012
      security: *id013
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                code:
                  type: string
                  minLength: 6
                  maxLength: 64
              required:
              - code
      parameters:
      - *id014
  /auth/mfa/disable:
    post:
      operationId: mfaDisable
      summary: Отключить 2FA и отозвать все сессии и API токены
      responses:
        '204':
          description: Действие завершено, тело отсутствует
        '401': *id006
        '403': *id007
        '404': *id008
        '409': *id009
        '422': *id010
        '429': *id011
        '503': *id012
      security: *id013
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                password:
                  type: string
                code:
                  type: string
              required:
              - password
              - code
      parameters:
      - *id014
  /security/roles:
    get:
      operationId: securityRoles
      summary: Просмотр ролей и их permissions
      responses:
        '200':
          description: Данные
          content:
            application/json:
              schema:
                type: object
        '401': *id006
        '403': *id007
        '404': *id008
        '409': *id009
        '422': *id010
        '429': *id011
        '503': *id012
      security: *id013
    post:
      operationId: securityCreateRole
      summary: Создать роль с разрешениями, которыми обладает создатель
      responses:
        '201':
          description: Данные
          content:
            application/json:
              schema:
                type: object
        '401': *id006
        '403': *id007
        '404': *id008
        '409': *id009
        '422': *id010
        '429': *id011
        '503': *id012
      security: *id013
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                slug:
                  type: string
                  pattern: ^[a-z][a-z0-9_-]{2,63}$
                name:
                  type: string
                permissions:
                  type: array
                  items:
                    type: string
              required:
              - slug
              - name
              - permissions
      parameters:
      - *id014
  /security/users:
    get:
      operationId: securityUsers
      summary: Пользователи и роли
      responses:
        '200':
          description: Данные
          content:
            application/json:
              schema:
                type: object
        '401': *id006
        '403': *id007
        '404': *id008
        '409': *id009
        '422': *id010
        '429': *id011
        '503': *id012
      security: *id013
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          maximum: 100
      - name: offset
        in: query
        schema:
          type: integer
    post:
      operationId: securityCreateUser
      summary: Создать пользователя без привилегий
      responses:
        '201':
          description: Данные
          content:
            application/json:
              schema:
                type: object
        '401': *id006
        '403': *id007
        '404': *id008
        '409': *id009
        '422': *id010
        '429': *id011
        '503': *id012
      security: *id013
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
                name:
                  type: string
                password:
                  type: string
                  minLength: 14
              required:
              - email
              - name
              - password
      parameters:
      - *id014
  /security/users/{id}:
    patch:
      operationId: securitySetUserActive
      summary: Включить/выключить учётную запись, отозвать доступ при отключении
      responses:
        '204':
          description: Действие завершено, тело отсутствует
        '401': *id006
        '403': *id007
        '404': *id008
        '409': *id009
        '422': *id010
        '429': *id011
        '503': *id012
      security: *id013
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                active:
                  type: boolean
              required:
              - active
      parameters: &id017
      - &id015
        name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - *id014
      - *id014
  /security/users/{id}/roles/{slug}:
    post:
      operationId: securityGrantRole
      summary: Назначить роль без расширения собственных полномочий
      responses:
        '204':
          description: Действие завершено, тело отсутствует
        '401': *id006
        '403': *id007
        '404': *id008
        '409': *id009
        '422': *id010
        '429': *id011
        '503': *id012
      security: *id013
      parameters:
      - *id015
      - *id014
      - &id016
        name: slug
        in: path
        required: true
        schema:
          type: string
      - *id014
    delete:
      operationId: securityRevokeRole
      summary: Отозвать роль с защитой последнего администратора
      responses:
        '204':
          description: Действие завершено, тело отсутствует
        '401': *id006
        '403': *id007
        '404': *id008
        '409': *id009
        '422': *id010
        '429': *id011
        '503': *id012
      security: *id013
      parameters:
      - *id015
      - *id014
      - *id016
      - *id014
  /security/audit:
    get:
      operationId: securityAudit
      summary: Чтение неизменяемого журнала аудита
      responses:
        '200':
          description: Данные
          content:
            application/json:
              schema:
                type: object
        '401': *id006
        '403': *id007
        '404': *id008
        '409': *id009
        '422': *id010
        '429': *id011
        '503': *id012
      security: *id013
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - name: before
        in: query
        schema:
          type: string
          format: date-time
  /security/webhooks:
    get:
      operationId: securityWebhookSources
      summary: Просмотр источников без секретов
      responses:
        '200':
          description: Данные
          content:
            application/json:
              schema:
                type: object
        '401': *id006
        '403': *id007
        '404': *id008
        '409': *id009
        '422': *id010
        '429': *id011
        '503': *id012
      security: *id013
    post:
      operationId: securityWebhookCreate
      summary: Создание источника, секрет возвращается однократно
      responses:
        '201':
          description: Данные
          content:
            application/json:
              schema:
                type: object
        '401': *id006
        '403': *id007
        '404': *id008
        '409': *id009
        '422': *id010
        '429': *id011
        '503': *id012
      security: *id013
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
              required:
              - name
      parameters:
      - *id014
  /security/webhooks/{id}:
    delete:
      operationId: securityWebhookRevoke
      summary: Отзыв секрета webhook
      responses:
        '204':
          description: Действие завершено, тело отсутствует
        '401': *id006
        '403': *id007
        '404': *id008
        '409': *id009
        '422': *id010
        '429': *id011
        '503': *id012
      security: *id013
      parameters: *id017
  /security/webhooks/events:
    get:
      operationId: securityWebhookEvents
      summary: Перечень сохранённых входящих событий без содержимого payload
      responses:
        '200':
          description: Данные
          content:
            application/json:
              schema:
                type: object
        '401': *id006
        '403': *id007
        '404': *id008
        '409': *id009
        '422': *id010
        '429': *id011
        '503': *id012
      security: *id013
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
  /webhooks/{id}/events:
    post:
      operationId: webhookReceive
