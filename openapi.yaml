      - name: workspace_id
        in: query
        required: true
        schema: &id023
          type: string
          format: uuid
        description: Доступное рабочее пространство
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 10000
          default: 0
      - name: type
        in: query
        schema: &id029
          type: string
          enum:
          - server
          - hypervisor_node
          - cluster
          - virtual_machine
          - container
          - router
          - workstation
          - other
      - name: status
        in: query
        schema: &id030
          type: string
          enum:
          - unknown
          - online
          - offline
          - maintenance
          - provisioning
          - decommissioned
      - name: search
        in: query
        schema:
          type: string
          maxLength: 100
      - name: tag
        in: query
        schema:
          type: string
          pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
      - name: group_id
        in: query
        schema:
          type: string
          format: uuid
      - name: owner_user_id
        in: query
        schema:
          type: string
          format: uuid
      - name: environment
        in: query
        schema:
          type: string
          maxLength: 64
      - name: source
        in: query
        schema:
