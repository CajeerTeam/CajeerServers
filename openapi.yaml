      - sessionAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision]
              properties:
                revision:
                  type: integer
                  minimum: 1
              additionalProperties: false
      responses:
        '200':
          description: Подтверждённая реальная проверка с безопасными счётчиками; без plaintext
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Коннектор или ожидающая версия изменены, либо отсутствует двойная привязка
        '412':
          description: Устаревшая версия коннектора
        '428':
          description: If-Match обязателен
        '501':
          description: Исполняемый драйвер отсутствует
        '502':
          description: Неверный секрет, TLS ошибка или удалённый API недоступен
