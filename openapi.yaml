    MetricSeries:
      type: object
      required: [id, asset_id, target_version, metric, resource_external_id, labels, kind, unit, last_seen_at]
      properties:
        ingestion_source_id: {type: [string, 'null'], format: uuid}
        id: {type: string, format: uuid}
        asset_id: {type: string, format: uuid}
        target_version: {type: integer, minimum: 1}
        metric: {type: string}
        resource_external_id: {type: string}
        labels: {type: object, additionalProperties: {type: string}}
        kind: {type: string, enum: [gauge, counter]}
        unit: {type: [string, 'null']}
        last_seen_at: {type: string, format: date-time}
    ProxmoxNodeDetails:
      type: object
      properties:
        pve_version: {type: string}
        uptime_seconds: {type: integer, minimum: 0}
        cpu_utilization: {type: number, minimum: 0, maximum: 1}
        cpu:
          type: object
          properties:
            model: {type: string}
            logical_cpus: {type: integer, minimum: 0}
            cores: {type: integer, minimum: 0}
            sockets: {type: integer, minimum: 0}
        memory_bytes: {type: object, additionalProperties: {type: string, pattern: '^[0-9]+$'}}
        swap_bytes: {type: object, additionalProperties: {type: string, pattern: '^[0-9]+$'}}
        rootfs_bytes: {type: object, additionalProperties: {type: string, pattern: '^[0-9]+$'}}
    ProxmoxNodeSnapshot:
      type: object
      required: [name, external_id, node_id, online, local, status, visible_in_nodes, details_state, details]
      properties:
        name: {type: string}
        external_id: {type: string}
        node_id: {type: [integer, 'null']}
        online: {type: [boolean, 'null']}
        local: {type: boolean}
        ip: {type: string}
        votes: {type: integer}
        status: {type: string, enum: [online, offline, unknown]}
        visible_in_nodes: {type: boolean}
        details_state: {type: string, enum: [available, not_visible, offline, status_uncertain, permission_denied, unavailable, rate_limited, budget_exhausted, no_data]}
        details:
          oneOf:
          - {$ref: '#/components/schemas/ProxmoxNodeDetails'}
          - {type: 'null'}
        last_details:
          oneOf:
          - {$ref: '#/components/schemas/ProxmoxNodeDetails'}
          - {type: 'null'}
        last_details_observed_at: {type: [string, 'null'], format: date-time}
    ProxmoxGuestState:
      type: object
      required: [state, observed_at, snapshot]
      properties:
        state: {type: string, enum: [not_collected, stale, available]}
        observed_at: {type: [string, 'null'], format: date-time}
        snapshot:
          oneOf:
            - {$ref: '#/components/schemas/ProxmoxGuestSnapshot'}
            - {type: 'null'}
    ProxmoxGuestSnapshot:
      type: object
      required: [schema_version, visibility, guest_count, details_complete]
      properties:
        schema_version: {type: integer, const: 1}
        visibility: {type: string, const: reported_only}
        guest_count: {type: integer, minimum: 0, maximum: 1500}
        details_complete: {type: boolean}
        guests:
          type: array
          items: {$ref: '#/components/schemas/ProxmoxGuest'}
    ProxmoxGuest:
      type: object
      required: [external_id, vmid, type, node, name, status, config_state, runtime_state, config, runtime]
      properties:
        external_id: {type: string}
        vmid: {type: integer}
        type: {type: string, enum: [qemu, lxc]}
        node: {type: string}
        name: {type: string}
        status: {type: string}
        pool: {type: string}
        template: {type: boolean}
        config_state: {type: string}
        runtime_state: {type: string}
        config:
          oneOf:
            - {$ref: '#/components/schemas/ProxmoxGuestConfig'}
            - {type: 'null'}
        runtime: {type: [object, 'null'], additionalProperties: {type: [number, string]}}
        config_observed_at: {type: string, format: date-time}
        last_config:
          oneOf:
            - {$ref: '#/components/schemas/ProxmoxGuestConfig'}
            - {type: 'null'}
        last_config_observed_at: {type: [string, 'null'], format: date-time}
    ProxmoxGuestConfig:
      type: object
      required: [disks, nics]
      properties:
        cores: {type: integer}
        sockets: {type: integer}
        vcpus: {type: integer}
        memory: {type: integer, description: Configured MiB}
        balloon: {type: integer}
        swap: {type: integer}
        cpu_model: {type: string}
        identity_fingerprint: {type: string}
        disks:
          type: array
          items:
            type: object
            required: [device]
            properties:
              device: {type: string}
              storage: {type: string}
              volume_id: {type: string}
              size: {type: string}
              source: {type: string}
              media: {type: string}
        nics:
          type: array
          items:
            type: object
            required: [device]
            properties:
              device: {type: string}
              mac: {type: string}
              model: {type: string}
              bridge: {type: string}
              tag: {type: integer}
              ip: {type: string}
              ip6: {type: string}
    ProxmoxClusterSnapshot:
      type: object
      required: [schema_version, cluster, standalone, membership_scope, visible_node_count, member_count, reported_node_count_mismatch, details_complete]
      properties:
        schema_version: {type: integer, const: 1}
        cluster:
          type: [object, 'null']
          required: [name, quorate]
          properties:
            name: {type: string}
            quorate: {type: boolean}
            reported_nodes: {type: integer}
            config_version: {type: integer}
            expected_votes: {type: integer}
            total_votes: {type: integer}
            votes: {type: integer}
        standalone: {type: boolean}
        membership_scope: {type: string, const: reported_only}
        visible_node_count: {type: integer, minimum: 0, maximum: 256}
        member_count: {type: integer, minimum: 1, maximum: 256}
        reported_node_count_mismatch: {type: boolean}
        details_complete: {type: boolean}
        nodes:
          description: Present in current state and individual run detail, omitted from run lists.
          type: array
          maxItems: 256
          items: {$ref: '#/components/schemas/ProxmoxNodeSnapshot'}
    ProxmoxClusterState:
      type: object
      required: [state, observed_at, snapshot]
      properties:
        state: {type: string, enum: [not_collected, stale, available]}
        observed_at: {type: [string, 'null'], format: date-time}
        snapshot:
          oneOf:
          - allOf:
            - {$ref: '#/components/schemas/ProxmoxClusterSnapshot'}
            - {required: [nodes]}
          - {type: 'null'}
    ProxmoxConnection:
      type: object
      properties:
        version: {type: string}
        cluster: {type: [string, 'null']}
        anchor_node: {type: string}
        anchor_id: {type: [integer, 'null']}
        endpoint_host: {type: string}
        endpoint_port: {type: integer}
        failover: {type: boolean}
        visible_members: {type: integer}
        quorate: {type: [boolean, 'null']}
        permissions_visible: {type: boolean}
        cluster_discovery: {$ref: '#/components/schemas/ProxmoxClusterSnapshot'}
        guest_discovery: {$ref: '#/components/schemas/ProxmoxGuestSnapshot'}
        root_privileges:
          type: array
          items: {type: string}
    ProxmoxProfile:
      type: object
      additionalProperties: false
      required: [anchor_node, primary_pin]
      properties:
        cluster: {type: [string, 'null'], maxLength: 120}
        anchor_node: {type: string, maxLength: 120}
        anchor_id: {type: [integer, 'null'], minimum: 1}
        primary_pin: {type: string, pattern: '^[a-fA-F0-9]{64}$'}
        fallbacks:
          type: array
          maxItems: 2
          items:
            type: object
            additionalProperties: false
            required: [host, port, pin]
            properties:
              host: {type: string, maxLength: 253}
              port: {type: integer, minimum: 1, maximum: 65535}
              pin: {type: string, pattern: '^[a-fA-F0-9]{64}$'}
    ConnectorTargetWithHealth:
      type: object
      required: [id, workspace_id, provider, name, endpoint_host, endpoint_port, state, version, etag, health_status, health_checked_at, health_success_at, health_duration_ms, health_error_code, circuit_open_until, consecutive_failures]
      properties:
        id: {type: string, format: uuid}
        workspace_id: {type: string, format: uuid}
        provider: {type: string, enum: [proxmox, vmmanager, ssh, winrm, snmp, custom, prometheus]}
        name: {type: string}
        endpoint_host: {type: string}
        endpoint_port: {type: integer, minimum: 1, maximum: 65535}
        proxmox_profile:
          oneOf:
            - $ref: '#/components/schemas/ProxmoxProfile'
            - {type: 'null'}
        asset_id: {type: [string, 'null'], format: uuid}
        state: {type: string, enum: [active, disabled]}
        version: {type: integer, minimum: 1}
        etag: {type: string}
        created_at: {type: string}
        updated_at: {type: string}
        health_status: {type: string, enum: [unknown, healthy, degraded, unreachable, auth_failed, disabled]}
        health_checked_at: {type: [string, 'null']}
        health_success_at: {type: [string, 'null']}
        health_duration_ms: {type: [integer, 'null'], minimum: 0}
        health_error_code: {type: [string, 'null']}
        circuit_open_until: {type: [string, 'null']}
        consecutive_failures: {type: integer, minimum: 0}
    ConnectorDiscoveredResource:
      type: object
      required: [external_id, resource_type, asset_id, presence, missed_complete, last_generation, allow_create]
      properties:
        external_id: {type: string}
        resource_type: {type: string}
        asset_id: {type: [string, 'null'], format: uuid}
        presence: {type: string, enum: [unknown, seen, stale, missing]}
        first_seen_at: {type: [string, 'null']}
        last_seen_at: {type: [string, 'null']}
        absent_since: {type: [string, 'null']}
        missed_complete: {type: integer, minimum: 0}
        last_generation: {type: integer, minimum: 0}
        conflict_code: {type: [string, 'null']}
        observed_name: {type: [string, 'null']}
        parent_external_id: {type: [string, 'null']}
        allow_create: {type: boolean}
    ConnectorDiscoveryResult:
      type: object
      required: [connector_id, mode, discovered, types]
      properties:
        connector_id: {type: string, format: uuid}
        mode: {type: string, enum: [inspect, sync]}
        discovered: {type: integer, minimum: 0}
        types:
          type: object
          additionalProperties: {type: integer, minimum: 0}
        outcomes:
          type: object
          additionalProperties: {type: integer, minimum: 0}
        preview:
          type: object
          required: [complete, summary, items, truncated]
          properties:
            complete: {type: boolean}
            summary:
              type: object
              additionalProperties: {type: integer, minimum: 0}
            items:
              type: array
              maxItems: 100
              items:
                type: object
                required: [external_id, type, action, candidate_ids]
                properties:
                  external_id: {type: string}
                  type: {type: string}
                  name: {type: [string, 'null']}
                  asset_id: {type: [string, 'null'], format: uuid}
                  action: {type: string, enum: [create, update, unchanged, conflict]}
                  conflict: {type: [string, 'null']}
                  parent_external_id: {type: [string, 'null']}
                  candidate_ids:
                    type: array
                    items: {type: string, format: uuid}
                  conflicted_fields:
                    type: array
                    items: {type: string}
            truncated: {type: boolean}
        snapshot:
          type: object
          required: [generation, complete, blocked, presence]
          properties:
            generation: {type: integer, minimum: 1}
            complete: {type: boolean}
            blocked: {type: integer, minimum: 0}
            presence:
              type: object
              additionalProperties: {type: integer, minimum: 0}
    VaultSecretInput:
      description: >-
        Write-only secret payload. Generic and api_token accept a string for backward
        compatibility; all other profiles require a strictly allowlisted object.
        Use GET /vault/profiles for required field names. Server validates the
        credential type and profile-specific field rules before encrypting.
      writeOnly: true
      oneOf:
      - type: string
        minLength: 1
        maxLength: 65536
      - type: object
        minProperties: 1
        maxProperties: 7
        additionalProperties:
          type: string
        description: Structured credential input; unknown fields are rejected by the runtime validator.
    VaultCredential:
      type: object
      additionalProperties: false
      required: [id, workspace_id, name, description, type, state, version, etag, created_at, updated_at, deleted_at]
      properties:
        id: {type: string, format: uuid}
        workspace_id: {type: string, format: uuid}
        name: {type: string}
        description: {type: string}
        type: {type: string, enum: [generic_secret, api_token, proxmox_api, vmmanager_api, ssh_password, ssh_private_key, winrm, snmp_v2c, snmp_v3]}
        state: {type: string, enum: [active, disabled, archived]}
        version: {type: integer, minimum: 1}
        etag: {type: string}
        created_at: {type: string}
        updated_at: {type: string}
        deleted_at: {type: [string, 'null']}
    VaultCredentialResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/VaultCredential'}
    VaultCredentialPage:
      type: object
      additionalProperties: false
      required: [data, pagination]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/VaultCredential'}
        pagination:
          type: object
          required: [total, limit, offset]
          properties:
            total: {type: integer, minimum: 0}
            limit: {type: integer, minimum: 1}
            offset: {type: integer, minimum: 0}
    CmdbIntegrityReport:
      type: object
      required: [ok, checked_at, totals, checks, deep]
      properties:
        ok:
          type: boolean
        checked_at:
          type: string
          format: date-time
        deep:
          type: boolean
        totals:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        checks:
          type: array
          items:
            type: object
            required: [name, ok, count]
            properties:
              name:
                type: string
              ok:
                type: boolean
              count:
                type: integer
                minimum: 0
    InventoryRelationship:
      type: object
      required: [id, workspace_id, source_asset_id, target_asset_id, kind, version, etag]
      properties:
        id: {type: string, format: uuid}
        workspace_id: {type: string, format: uuid}
        source_asset_id: {type: string, format: uuid}
        target_asset_id: {type: string, format: uuid}
        kind: {type: string, enum: [cluster_contains, hosts, depends_on, connected_to]}
        version: {type: integer, minimum: 1}
        etag: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Health:
      type: object
      additionalProperties: false
      required:
      - status
      - service
      - scope
      properties:
        status:
          type: string
          enum:
          - ready
          - not_ready
        service:
          type: string
          const: cajeerservers
        scope:
          type: string
          const: runtime
    System:
      type: object
      additionalProperties: false
      required:
      - name
      - version
      - api_version
      - type
      properties:
        name:
          type: string
        version:
          type: string
        api_version:
          type: string
          const: v1
        type:
          type: string
          const: api-first web control shell
    Problem:
      type: object
      additionalProperties: true
      required:
      - type
      - title
      - status
      - code
      - request_id
      properties:
        type:
          type: string
          const: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
        request_id:
          type: string
          pattern: ^[a-f0-9]{24}$
        errors:
          type: array
          items:
            type: object
            required:
            - field
            - message
            properties:
              field:
                type: string
              message:
                type: string
    User:
      type: object
      additionalProperties: false
      required:
      - id
      - email
      - name
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
    Login:
      type: object
      additionalProperties: false
      required:
      - user
      - auth_type
      - csrf_token
      - expires_in
      properties:
        user:
          $ref: '#/components/schemas/User'
        auth_type:
          type: string
          const: session
        csrf_token:
          type: string
        expires_in:
          type: integer
          const: 43200
    Principal:
      type: object
      required:
      - user
      - auth_type
      - scopes
      properties:
        user:
          $ref: '#/components/schemas/User'
        auth_type:
          type: string
          enum:
          - session
          - token
        scopes:
          type: array
          items:
            type: string
    Csrf:
      type: object
      required:
      - csrf_token
      properties:
        csrf_token:
          type: string
    Session:
      type: object
      required:
      - id
      - created_at
      - last_seen_at
      - expires_at
      - current
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
        last_seen_at:
          type: string
        expires_at:
          type: string
        current:
          type: boolean
    Sessions:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Session'
    TokenInfo:
      type: object
      required:
      - id
      - name
      - scopes
      - created_at
      - expires_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        created_at:
          type: string
        expires_at:
          type:
          - string
          - 'null'
        last_used_at:
          type:
          - string
          - 'null'
    IssuedToken:
      allOf:
      - $ref: '#/components/schemas/TokenInfo'
      - type: object
        required:
        - token
        properties:
          token:
            type: string
            description: Секрет выдаётся однократно
    Tokens:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TokenInfo'
    SecurityRole:
      type: object
      required:
      - id
      - slug
      - name
      - permissions
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        permissions:
          type: array
          items:
            type: string
    WebhookReceived:
      type: object
      required:
      - id
      - status
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          const: received
    InventoryAsset:
      type: object
      required:
      - id
      - workspace_id
      - type
      - source
      - name
      - status
      - version
      - etag
      properties:
        id: *id023
        workspace_id: *id023
        owner_user_id:
          anyOf:
          - *id023
          - type: 'null'
        type: *id029
        source:
          type: string
        external_id:
          anyOf:
          - type: string
          - type: 'null'
        name:
          type: string
          maxLength: 255
        status:
          type: string
        os_family:
          anyOf:
          - type: string
          - type: 'null'
        ip_addresses:
          type: array
          items:
            type: string
        environment:
          type: string
          description: Workspace-local environment identifier
        tags:
          type: array
          items:
            type: string
        attributes:
          type: object
          additionalProperties: true
        version:
          type: integer
          minimum: 1
        etag:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
        deleted_at:
          anyOf:
          - type: string
          - type: 'null'
    CreateInventoryAsset:
      type: object
      required:
      - workspace_id
      - type
      - name
      additionalProperties: false
      properties:
        workspace_id: *id023
        type: *id029
        name: &id031
          type: string
          minLength: 1
          maxLength: 255
        status: *id030
        os_family: &id032
          anyOf:
          - type: string
            enum:
            - windows
            - debian
            - ubuntu
            - linux
            - other
          - type: 'null'
        ip_addresses: &id033
          type: array
          maxItems: 64
          items:
            type: string
            maxLength: 45
        environment: &id037
          type: string
          pattern: '^[a-z][a-z0-9_-]{0,63}$'
        tags: &id034
          type: array
          maxItems: 50
          items:
            type: string
        attributes: &id035
          type: object
        owner_user_id: &id036
          anyOf:
          - *id023
          - type: 'null'
    UpdateInventoryAsset:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: *id031
        status: *id030
        os_family: *id032
        ip_addresses: *id033
        environment: *id037
        tags: *id034
        attributes: *id035
        owner_user_id: *id036
    InventoryAssetResponse:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/InventoryAsset'
    InventoryAssetsResponse:
      type: object
      required:
      - data
      - total
      - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/InventoryAsset'
        total:
          type: integer
        pagination:
          type: object
          required:
          - limit
          - offset
          - total
          properties:
            limit:
              type: integer
            offset:
              type: integer
            total:
              type: integer
            next_cursor:
              type: [string, "null"]
    CatalogEntry:
      type: object
      required:
      - id
      - workspace_id
      - slug
      - name
      - description
      - version
      - etag
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        version:
          type: integer
        etag:
          type: string
        asset_count:
          type: integer
        created_at:
          type: string
        updated_at:
          type: string
    CatalogEntryResponse:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/CatalogEntry'
    CatalogPage:
      type: object
      required:
      - data
      - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CatalogEntry'
        pagination:
          type: object
          properties:
            limit:
              type: integer
            offset:
              type: integer
            total:
              type: integer
    CreateCatalogEntry:
      type: object
      required:
      - workspace_id
      - slug
      - name
      additionalProperties: false
      properties:
        workspace_id:
          type: string
          format: uuid
        slug:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 128
        description:
          type: string
          maxLength: 1024
    UpdateCatalogEntry:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 128
        description:
          type: string
          maxLength: 1024
  responses:
    NotAcceptable:
      description: The Accept header does not permit JSON
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Требуется действующая сессия или bearer-токен
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Не прошла проверка CSRF, origin или scope
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Некорректное содержимое запроса
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Заблокированы повторные попытки входа
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: Установка не завершена или зависимости недоступны
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    metricsBearer:
      type: http
      scheme: bearer
      description: Отдельный статический scrape token, не API token пользователя.
    sessionAuth:
      type: apiKey
      in: cookie
      name: __Host-cajeer_session
      description: Сессия; для локального HTTP имя cookie cajeer_session.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Opaque
      description: at1.<uuid>.<random>, хранится только sha256, поддерживаются лишь 3 read-scopes.
    webhookHmac:
      type: apiKey
      in: header
      name: X-Cajeer-Signature
      description: sha256=<hex64> HMAC-SHA256 от v1.<unix_timestamp>.<raw_body>; отдельно X-Cajeer-Timestamp, дрейф не
        более 300 секунд.
    connectorWebhookHmac:
      type: apiKey
      in: header
      name: X-Cajeer-Signature
      description: sha256=<hex64>; HMAC-SHA256 binds timestamp, source UUID and raw body.
