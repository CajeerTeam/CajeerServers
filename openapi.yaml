openapi: 3.1.1
info:
  title: CajeerServers REST API
  version: 0.1.2
  description: |
    Реально доступные публичные HTTP операции версии 0.1.2.
    API inventory, connectors, scripts, sync, actions и webhooks не опубликованы:
    они появятся после реализации persistence, аутентификации и проверки прав.
servers:
  - url: /api/v1
security: []
paths:
  /health:
    get:
      operationId: runtimeHealth
      summary: Проверка готовности PHP runtime и конфигурации
      description: Не проверяет PostgreSQL, Redis, VMmanager, Proxmox или внешние API.
      responses:
        '200':
          description: Runtime готов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Ошибка prerequisite runtime
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '406':
          $ref: '#/components/responses/NotAcceptable'
  /system:
    get:
      operationId: publicSystemInfo
      summary: Публичные сведения о приложении и версии API
      responses:
        '200':
          description: Метаданные приложения
          content:
            application/json:
              schema: { $ref: '#/components/schemas/System' }
        '406':
          $ref: '#/components/responses/NotAcceptable'
components:
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, service, scope]
      properties:
        status: { type: string, enum: [ready, not_ready] }
        service: { type: string, const: cajeerservers }
        scope: { type: string, const: runtime }
    System:
      type: object
      additionalProperties: false
      required: [name, version, api_version, type]
      properties:
        name: { type: string }
        version: { type: string }
        api_version: { type: string, const: v1 }
        type: { type: string, const: 'api-first web control shell' }
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, code, request_id]
      properties:
        type: { type: string, const: 'about:blank' }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        code: { type: string }
        request_id: { type: string, pattern: '^[a-f0-9]{24}$' }
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
  responses:
    NotAcceptable:
      description: The Accept header does not permit JSON
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
