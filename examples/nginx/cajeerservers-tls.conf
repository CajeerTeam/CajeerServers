# CajeerServers 0.1.9: SAME ORIGIN Nuxt SSR + PHP API.
# Before activation set APP_URL=https://servers.example.com, and run Nuxt on 127.0.0.1:3000.
# No user files or application secrets may be served directly.
server {
    listen 80;
    server_name servers.example.com;
    return 308 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name servers.example.com;
    ssl_certificate /etc/letsencrypt/live/servers.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/servers.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/cajeerservers/public;
    autoindex off;
    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # No public PHP entrypoint; all PHP requests enter via the allowlisted locations.
    location = /index.php { return 404; }
    location ~ \.php$ { return 404; }
    location ~ /\. { return 404; }

    location ^~ /api/v1/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_read_timeout 30s;
    }

    location = /install {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
