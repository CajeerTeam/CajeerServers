# Example for a single Nginx TLS termination point. Replace server_name,
# certificates and PHP socket; test with `nginx -t` before reloading.
# Do NOT expose the application on plaintext HTTP in production.
server {
    listen 80;
    server_name servers.example.com;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name servers.example.com;
    ssl_certificate /etc/letsencrypt/live/servers.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/servers.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/cajeerservers/public;
    index index.php;
    autoindex off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
