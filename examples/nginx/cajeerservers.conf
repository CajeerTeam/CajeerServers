# CajeerServers web root must be the public/ directory, NEVER the project root.
# Terminate TLS at Nginx (or a properly configured trusted frontend).
server {
    listen 80;
    server_name cajeerservers.local;
    root /var/www/cajeerservers/public;
    index index.php;

    autoindex off;
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Only the front controller may be executed as PHP.
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
# For remote Web Installer use HTTPS and make HTTPS=on visible to PHP-FPM.
# For local-only HTTP installation set APP_ENV=local and connect from loopback.
